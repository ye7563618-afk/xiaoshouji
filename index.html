<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="迟川小手机" />
  <meta name="theme-color" content="#fceef2" />
  <link rel="apple-touch-icon" href="icon.jpg" />
  <link rel="icon" href="icon.jpg" />
  <title>迟川 · 粉嫩奶油梦角小手机</title>
  <style>
    :root {
      --app-h: 100vh;
      --bg-grad: linear-gradient(168deg, #fff5f8 0%, #fde6ee 48%, #f8dce7 100%);
      --glass: rgba(255, 255, 255, 0.72);
      --glass-hi: rgba(255, 255, 255, 0.88);
      --glass-line: rgba(255, 255, 255, 0.85);
      --pink: #e58ca8;
      --pink-deep: #c96283;
      --pink-soft: rgba(229, 140, 168, 0.16);
      --cream: #fffaf0;
      --text: #4a353d;
      --muted: #8f747e;
      --dim: #b59aa4;
      --bub-him: rgba(255, 255, 255, 0.92);
      --bub-me: linear-gradient(135deg, #f3a4bd, #e283a2);
      --bub-me-t: #ffffff;
      --shadow: 0 10px 28px rgba(196, 114, 142, 0.14);
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body.theme-cream {
      --bg-grad: linear-gradient(168deg, #fffcf7 0%, #f7efe4 52%, #efe4d6 100%);
      --pink: #cfa07a; --pink-deep: #a97852; --pink-soft: rgba(207, 160, 122, 0.16);
      --text: #45382e; --muted: #8a786b; --dim: #b2a296;
      --bub-me: linear-gradient(135deg, #dfb48e, #c6946b);
      --shadow: 0 10px 28px rgba(154, 118, 86, 0.13);
    }
    body.theme-night {
      --bg-grad: linear-gradient(168deg, #16131a 0%, #100e14 55%, #19131b 100%);
      --glass: rgba(28, 24, 34, 0.78); --glass-hi: rgba(36, 31, 44, 0.9);
      --glass-line: rgba(242, 198, 212, 0.18);
      --pink: #e5a3b6; --pink-deep: #f4c1cf; --pink-soft: rgba(229, 163, 182, 0.16);
      --cream: #241f2a; --text: #f6eef1; --muted: #b5a3ab; --dim: #7f6d75;
      --bub-him: rgba(40, 35, 48, 0.94); --bub-me: linear-gradient(135deg, #c97390, #a75572);
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.48);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: text; font-family: inherit; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: var(--app-h);
      background: #f9e4ec; color: var(--text); overflow: hidden; overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.theme-night { background: #0c0a0f; }

    .phone {
      position: relative; width: 100%; max-width: 450px; height: var(--app-h);
      margin: 0 auto; overflow: hidden; display: flex; flex-direction: column;
      background: var(--bg-grad); background-size: cover; background-position: center;
    }
    @media (min-width: 500px) {
      .phone { box-shadow: 0 24px 80px rgba(130, 68, 92, 0.22); border-left: 1px solid var(--glass-line); border-right: 1px solid var(--glass-line); }
    }
    .wp-layer {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      pointer-events: none; z-index: 0; transition: opacity 0.3s;
    }
    .wp-veil {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse 90% 40% at 50% 0%, rgba(255,255,255,0.38), transparent 72%);
    }
    body.theme-night .wp-veil { background: linear-gradient(180deg, rgba(14,11,18,0.45), rgba(14,11,18,0.68)); }

    button { border: none; background: none; color: inherit; font-family: inherit; cursor: pointer; padding: 0; }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.55; pointer-events: none; }
    .hidden { display: none !important; }
    .no-sb { scrollbar-width: none; -ms-overflow-style: none; }
    .no-sb::-webkit-scrollbar { display: none; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stack { display: flex; flex-direction: column; gap: 11px; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    /* 顶部状态与下拉手柄（避开 iPhone 灵动岛原生下拉） */
    .top-pill-bar {
      position: relative; z-index: 20; flex-shrink: 0;
      padding: max(12px, var(--sat)) 18px 6px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pull-pill {
      padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 500;
      background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-line); color: var(--pink-deep); box-shadow: var(--shadow);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .unread-dot {
      min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px;
      background: #ef6b8f; color: #fff; font-size: 10px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* 主桌面容器与双页滑动 */
    .home-wrap {
      position: relative; z-index: 10; flex: 1; min-height: 0;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .pages-vp { flex: 1; min-height: 0; overflow: hidden; position: relative; }
    .pages-track { display: flex; width: 100%; height: 100%; transition: transform 0.34s cubic-bezier(.22,1,.36,1); }
    .page-slide {
      width: 100%; flex-shrink: 0; padding: 4px 18px 8px;
      overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 13px;
    }
    .page-slide::-webkit-scrollbar { display: none; }

    /* 时钟与桌面消息卡 */
    .clock-box { text-align: center; padding-top: 2px; }
    .clock-date { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
    .clock-time {
      font-size: 56px; font-weight: 300; line-height: 1.05; letter-spacing: -0.02em;
      color: var(--text); font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 14px rgba(255, 255, 255, 0.45);
    }
    body.theme-night .clock-time { text-shadow: none; }

    .desk-banner {
      width: 100%; text-align: left; padding: 11px 13px; border-radius: 22px;
      background: var(--glass-hi); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-line); box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 11px;
    }
    .av {
      width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0; overflow: hidden;
      background: linear-gradient(135deg, #f6bfd0, #e692ad); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
    }
    .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .av.sm { width: 34px; height: 34px; border-radius: 11px; font-size: 13px; }
    .tag-chip {
      display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 9.5px; font-weight: 600;
      background: var(--pink-soft); color: var(--pink-deep);
    }

    /* 拍立得 & Ta 记得便利贴小组件 */
    .widgets-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .polaroid-w {
      background: rgba(255, 255, 255, 0.92); border-radius: 16px; padding: 8px 8px 11px;
      box-shadow: var(--shadow); border: 1px solid var(--glass-line); text-align: center;
      transform: rotate(-1.2deg); transition: transform 0.2s;
    }
    body.theme-night .polaroid-w { background: rgba(34, 29, 41, 0.92); }
    .polaroid-w:active { transform: scale(0.96) rotate(0deg); }
    .polaroid-img {
      width: 100%; aspect-ratio: 1.12; border-radius: 10px; overflow: hidden;
      background: linear-gradient(145deg, #fbd8e4, #f7e6cf);
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .polaroid-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .polaroid-cap { font-size: 11px; color: var(--muted); margin-top: 7px; font-weight: 500; }

    .sticky-w {
      position: relative; background: var(--cream); border-radius: 16px; padding: 14px 12px 11px;
      box-shadow: var(--shadow); border: 1px solid rgba(235, 194, 175, 0.45);
      display: flex; flex-direction: column; justify-content: space-between; text-align: left;
      transform: rotate(1.1deg);
    }
    .sticky-tape {
      position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      width: 44px; height: 12px; border-radius: 3px;
      background: rgba(242, 162, 188, 0.58);
    }
    .sticky-lbl { font-size: 10.5px; font-weight: 700; color: var(--pink-deep); }
    .sticky-txt {
      font-size: 12px; line-height: 1.55; color: var(--text); margin: 6px 0;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .sticky-sign { font-size: 10px; color: var(--muted); text-align: right; }

    /* 桌面 App 图标网格 */
    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; }
    .app-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .app-ic {
      position: relative; width: 56px; height: 56px; border-radius: 17px;
      background: var(--glass-hi); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--glass-line); box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center; color: var(--pink-deep);
    }
    .app-ic .bdg {
      position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px;
      border-radius: 999px; background: #ef6186; color: #fff; font-size: 10px; font-weight: 700;
      border: 2px solid #fff; display: flex; align-items: center; justify-content: center;
    }
    .app-lbl { font-size: 11px; color: var(--text); font-weight: 500; text-shadow: 0 1px 6px rgba(255,255,255,0.7); }
    body.theme-night .app-lbl { text-shadow: none; }

    /* 分页点与底部磨砂 Dock */
    .dock-area {
      flex-shrink: 0; padding: 6px 16px max(14px, var(--sab));
      display: flex; flex-direction: column; align-items: center; gap: 9px;
    }
    .pdots { display: flex; gap: 7px; }
    .pdot { width: 6px; height: 6px; border-radius: 999px; background: rgba(201, 98, 131, 0.25); transition: all 0.22s; }
    .pdot.on { width: 18px; background: var(--pink-deep); }
    .dock {
      width: 100%; border-radius: 26px; padding: 10px 14px;
      background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-line); box-shadow: var(--shadow);
      display: grid; grid-template-columns: repeat(4, 1fr); place-items: center;
    }

    /* ========== 顶部实时推送横幅 & 下拉通知中心 ========== */
    #topBanner {
      position: absolute; left: 12px; right: 12px; top: max(10px, var(--sat)); z-index: 90;
      padding: 11px 13px 14px; border-radius: 22px; cursor: pointer; touch-action: none;
      background: var(--glass-hi); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1.5px solid var(--glass-line); box-shadow: 0 14px 36px rgba(176, 86, 118, 0.24);
      display: flex; align-items: center; gap: 10px;
      transform: translateY(-150%); opacity: 0; pointer-events: none;
      transition: transform 0.34s cubic-bezier(.22,1,.36,1), opacity 0.24s;
    }
    #topBanner.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    #topBanner.dragging { transition: none; }
    .ban-close {
      width: 22px; height: 22px; border-radius: 999px; flex-shrink: 0;
      background: var(--pink-soft); color: var(--pink-deep); font-size: 11px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .ban-handle {
      position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
      width: 34px; height: 3.5px; border-radius: 99px;
      background: rgba(196, 114, 142, 0.34); pointer-events: none;
    }

    #notifShade {
      position: absolute; inset: 0; z-index: 75;
      background: rgba(246, 224, 232, 0.72);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      display: flex; flex-direction: column;
      transform: translateY(-100%); opacity: 0; pointer-events: none;
      transition: transform 0.36s cubic-bezier(.22,1,.36,1), opacity 0.26s;
    }
    body.theme-night #notifShade { background: rgba(16, 13, 21, 0.84); }
    #notifShade.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .notif-card {
      width: 100%; text-align: left; padding: 12px 13px; border-radius: 20px;
      background: var(--glass-hi); border: 1px solid var(--glass-line); box-shadow: var(--shadow);
      display: flex; align-items: flex-start; gap: 10px;
    }

    /* ========== 应用二级全屏层 ========== */
    #appLayer {
      position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
      background: var(--bg-grad);
      transform: translateX(100%); opacity: 0.4; pointer-events: none;
      transition: transform 0.28s cubic-bezier(.22,1,.36,1), opacity 0.22s;
    }
    #appLayer.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
    .app-hd {
      flex-shrink: 0; padding: max(12px, var(--sat)) 14px 10px;
      background: var(--glass-hi); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-line);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .back-btn {
      padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
      background: var(--pink-soft); color: var(--pink-deep);
      display: inline-flex; align-items: center; gap: 3px;
    }
    .app-body {
      flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 13px 14px max(24px, var(--sab));
    }

    /* 通用卡片与表单 */
    .card {
      background: var(--glass-hi); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-line); border-radius: 20px; padding: 14px; box-shadow: var(--shadow);
    }
    .sec-t { font-size: 14px; font-weight: 600; color: var(--text); }
    .sec-s { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
    .inp {
      width: 100%; padding: 10px 12px; border-radius: 14px; font-size: 13px;
      background: rgba(255, 255, 255, 0.78); border: 1.2px solid rgba(229, 140, 168, 0.34);
      color: var(--text); outline: none;
    }
    body.theme-night .inp { background: rgba(16, 13, 21, 0.82); border-color: rgba(229, 163, 182, 0.28); }
    .inp:focus { border-color: var(--pink-deep); }
    textarea.inp { resize: none; line-height: 1.6; }
    .btn {
      width: 100%; padding: 10.5px 14px; border-radius: 14px; font-size: 12.5px; font-weight: 600;
      text-align: center; background: var(--glass); border: 1px solid var(--glass-line); color: var(--text);
    }
    .btn.pink {
      background: linear-gradient(135deg, #f19ab6, #da7496); color: #fff; border-color: transparent;
      box-shadow: 0 8px 20px rgba(218, 116, 150, 0.28);
    }
    .btn.soft { background: var(--pink-soft); color: var(--pink-deep); border-color: rgba(229, 140, 168, 0.3); }
    .btn.danger { background: rgba(235, 96, 122, 0.14); color: #d14866; border-color: rgba(235, 96, 122, 0.32); }

    .sw { width: 44px; height: 24px; border-radius: 999px; background: rgba(180, 150, 162, 0.32); position: relative; transition: background 0.2s; flex-shrink: 0; }
    .sw.on { background: var(--pink-deep); }
    .sw i { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.18); }
    .sw.on i { transform: translateX(20px); }

    /* ========== 聊天界面 ========== */
    .chat-bg { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background-size: cover; background-position: center; }
    .chat-msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 13px; display: flex; flex-direction: column; gap: 11px; }
    .m-row { display: flex; align-items: flex-start; gap: 8px; animation: popIn 0.24s ease; }
    .m-row.me { flex-direction: row-reverse; }
    .m-col { display: flex; flex-direction: column; min-width: 0; max-width: 76%; }
    .bub {
      max-width: 100%; width: fit-content; padding: 10px 13px; border-radius: 18px; font-size: 13.5px; line-height: 1.62;
      white-space: pre-wrap; word-break: break-word; box-shadow: 0 4px 14px rgba(176, 102, 128, 0.1);
    }
    .bub.him { background: var(--bub-him); color: var(--text); border-top-left-radius: 5px; border: 1px solid var(--glass-line); }
    .bub.me { background: var(--bub-me); color: var(--bub-me-t); border-top-right-radius: 5px; }
    .m-time { font-size: 10px; color: var(--dim); margin-top: 3px; }
    .sys-pill {
      align-self: center; padding: 4px 12px; border-radius: 999px; font-size: 11px; color: var(--muted);
      background: var(--glass); border: 1px solid var(--glass-line);
    }
    .recalled-btn {
      align-self: center; padding: 5px 12px; border-radius: 999px; font-size: 11px; color: var(--pink-deep);
      background: var(--pink-soft); border: 1px dashed rgba(201, 98, 131, 0.45);
    }
    .voice-bub {
      min-width: 148px; padding: 9px 13px; border-radius: 18px; border-top-left-radius: 5px;
      background: var(--bub-him); border: 1px solid var(--glass-line);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--pink-deep); font-size: 12px;
    }
    .v-trans {
      margin-top: 5px; max-width: 245px; padding: 8px 11px; border-radius: 13px;
      background: var(--glass); border: 1px solid var(--glass-line); font-size: 12px; line-height: 1.6; color: var(--text);
    }
    .transfer-bub {
      width: 214px; padding: 11px 13px; border-radius: 18px; color: #fff; text-align: left;
      background: linear-gradient(135deg, #f3a683, #e67e98); box-shadow: 0 8px 18px rgba(230, 126, 152, 0.28);
    }
    .chat-bar {
      flex-shrink: 0; padding: 8px 11px max(12px, var(--sab));
      background: var(--glass-hi); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-line);
    }
    .quick-rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 7px; scrollbar-width: none; }
    .quick-rail::-webkit-scrollbar { display: none; }
    .qchip {
      flex-shrink: 0; padding: 4px 10px; border-radius: 999px; font-size: 11px;
      background: var(--pink-soft); color: var(--pink-deep); border: 1px solid rgba(229, 140, 168, 0.25);
    }

    /* 弹窗与 Toast */
    #modal {
      position: absolute; inset: 0; z-index: 85;
      background: rgba(68, 42, 52, 0.42); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center; padding: 10px;
    }
    .sheet {
      width: 100%; max-height: 86%; overflow-y: auto; border-radius: 26px; padding: 16px 15px 20px;
      background: var(--glass-hi); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid var(--glass-line); box-shadow: 0 -14px 40px rgba(120, 62, 84, 0.22);
      animation: popIn 0.24s ease;
    }
    body.theme-night .sheet { background: #191520; }
    #toast {
      position: absolute; left: 50%; bottom: calc(28px + var(--sab)); z-index: 98;
      transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
      padding: 8px 16px; border-radius: 999px; max-width: 90%; text-align: center;
      background: rgba(74, 53, 61, 0.92); color: #fff; font-size: 11.5px;
      box-shadow: 0 10px 26px rgba(74, 53, 61, 0.25); transition: all 0.24s ease;
    }
    #toast.show { transform: translate(-50%, 0); opacity: 1; }
    #iconPreviewImg { width: 148px; height: 148px; border-radius: 32px; display: block; border: 2px solid #fff; box-shadow: var(--shadow); -webkit-touch-callout: default; user-select: auto; }

    /* 幸福感小应用扩展样式 */
    .mood-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mood-btn {
      padding: 11px 6px; border-radius: 16px; text-align: center;
      background: var(--glass); border: 1.2px solid var(--glass-line);
      display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.2s;
    }
    .mood-btn.on { background: var(--pink-soft); border-color: var(--pink-deep); transform: translateY(-1px); }
    .fortune-slip {
      border-radius: 22px; padding: 20px 16px; text-align: center; position: relative; overflow: hidden;
      background: linear-gradient(155deg, rgba(255, 250, 244, 0.96), rgba(254, 232, 240, 0.94));
      border: 1.5px solid rgba(229, 140, 168, 0.48); box-shadow: var(--shadow);
      animation: popIn 0.35s ease;
    }
    body.theme-night .fortune-slip { background: linear-gradient(155deg, #271f2c, #1c1622); }
    .wish-item {
      padding: 12px 13px; border-radius: 18px; background: var(--glass-hi);
      border: 1px solid var(--glass-line); box-shadow: var(--shadow);
    }
    .wish-item.done { border-color: rgba(229, 140, 168, 0.55); }
    .wb-chip {

    function compressImage(file, maxW = 720, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('读取失败'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('图片格式不支持'));
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const cv = document.createElement('canvas');
            cv.width = Math.round(img.width * scale);
            cv.height = Math.round(img.height * scale);
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            resolve(cv.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function callDualAPI(sysPrompt, userPrompt) {
      const model = getActiveModel();
      if (ST.cfg.provider === 'gemini') {
        const key = ST.cfg.geminiKey.trim();
        if (!key) throw new Error('未填写 Gemini API Key');
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
        const res = await fetch(url, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: sysPrompt }] },
            generationConfig: { responseMimeType: 'application/json', temperature: 0.88 }
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleaned = raw.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim();
        return JSON.parse(cleaned);
      } else {
        const key = ST.cfg.openaiKey.trim();
        const base = (ST.cfg.openaiUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
        if (!key) throw new Error('未填写 OpenAI 兼容 API Key');
        const res = await fetch(`${base}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
          body: JSON.stringify({
            model, temperature: 0.88,
            messages: [
              { role: 'system', content: sysPrompt + '\n严格只返回合法JSON，禁止任何多余解释或Markdown标记。' },
              { role: 'user', content: userPrompt }
            ]
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
        const raw = data?.choices?.[0]?.message?.content || '';
        const cleaned = raw.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim();
        const m = cleaned.match(/\{[\s\S]*\}/);
        return JSON.parse(m ? m[0] : cleaned);
      }
    }

    /* =========================================================================
       七、贴合迟川人设的主动发消息、离线补发与「迟川式失联消息轰炸」引擎
       ========================================================================= */
    function pushIncomingMsg(ch, msgObj, { silent = false, timeStr = null } = {}) {
      const t = timeStr || nowHM();
      const item = { id: 'in_' + Date.now() + '_' + Math.floor(Math.random() * 999), side: 'him', t, ...msgObj };
      ch.msgs.push(item);
      if (ch.msgs.length > 160) ch.msgs.shift();

      const preview = item.recalled ? '撤回了一条消息（轻触偷看）'
        : item.voice ? `[语音 ${item.voice}″] ${item.text}`
        : item.transfer ? `[转账 ¥${Number(item.transfer).toLocaleString()}] ${item.note || ''}`
        : item.text;

      const inActiveChat = RT.app === 'chat' && ST.activeCharId === ch.id;
      ST.notifs.unshift({
        id: 'nf_' + Date.now() + '_' + Math.floor(Math.random() * 99),
        charId: ch.id, name: ch.name, t, text: preview, unread: !inActiveChat
      });
      if (ST.notifs.length > 40) ST.notifs.pop();

      saveST();
      if (!silent) SFX.msg();
      renderHomeWidgets();
      if (RT.notifOpen) renderNotifShade();
      if (inActiveChat) vChat();
      else if (!silent) showTopBanner(ch, preview);
    }

    function resetIdleTimer() {
      clearTimeout(RT.idleTimer);
      if (!ST.cfg.proactiveOn) return;
      const sec = Math.max(30, Number(ST.cfg.proactiveSec || 90));
      RT.idleTimer = setTimeout(() => {
        if (ST.cfg.proactiveOn && !RT.typing) triggerProactiveBurst(false);
      }, sec * 1000);
    }

    async function triggerProactiveBurst(manual = false) {
      const ch = activeChar();
      const stage = (ch.proactiveStage || 0) % PROACTIVE_WAVES.length;
      ch.proactiveStage = stage + 1;
      saveST();

      let wave = PROACTIVE_WAVES[stage];
      if (hasValidAPI()) {
        try {
          const hist = ch.msgs.slice(-6).map(m => `${m.side === 'me' ? ST.userName : ch.name}: ${m.text || ''}`).join('\n');
          const stageDesc = stage === 0
            ? '找一个自然的日常小事轻轻问候她1~2句，不催促'
            : stage === 1
              ? '没等到回复，怕打扰她先克制地收住，说让她先忙'
              : '隔了一阵还是没忍住又补发1~2句，流露克制的想念，可带一条悄悄撤回的直白想念';
          const j = await callDualAPI(
            buildCharSystemPrompt(ch),
            `当前主动发消息阶段（第${stage + 1}波）：${stageDesc}。\n最近聊天：\n${hist}\n请严格返回JSON：{"bubbles":["气泡1","气泡2"],"recall":"可选撤回的直白想念或空字符串","voice":"可选短语音转写或空字符串"}`
          );
          if (j && Array.isArray(j.bubbles) && j.bubbles.length) {
            wave = j.bubbles.slice(0, 3).map(t => ({ text: String(t) }));
            if (j.recall) wave.splice(Math.min(1, wave.length), 0, { recalled: true, text: String(j.recall) });
            if (j.voice) wave.push({ voice: Math.max(7, Math.min(14, Math.round(String(j.voice).length / 4.2))), text: String(j.voice) });
          }
        } catch {}
      }

      if (manual) toast(`${ch.name} 正在向你发来消息…`);
      wave.forEach((m, idx) => {
        const t = setTimeout(() => {
          pushIncomingMsg(ch, m, { silent: false });
        }, 450 + idx * 1350);
        RT.burstTimers.push(t);
      });
      resetIdleTimer();
    }

    async function runOfflineCatchup(awayHours = 3) {
      const ch = activeChar();
      const now = Date.now();
      const spans = [awayHours * 0.72, awayHours * 0.42, awayHours * 0.14, 0.02];
      let pack = [
        { text: '刚结束完下午的评审会，顺手给窗台多肉松了松土。' },
        { text: '你还在忙吗？没关系，不用急着回，先专心做自己的事。' },
        { recalled: true, text: '其实每隔二十分钟都在看屏幕，很想听听你的声音。' },
        { text: `……还是没忍住。已经过${awayHours}个小时了，看到记得跟我报个平安，${ch.userCall}。` }
      ];

      if (hasValidAPI()) {
        try {
          const j = await callDualAPI(
            buildCharSystemPrompt(ch),
            `${ST.userName}已经离开手机大约 ${awayHours} 小时没回消息，现在刚点开小手机。请按时间线生成 3~4 条符合你人设（克制→怕打扰收住→实在没忍住补发）的等待消息，以及可选1条撤回句。返回JSON：{"bubbles":["消息1","消息2","消息3"],"recall":"可选撤回句或空"}`
          );
          if (j && Array.isArray(j.bubbles) && j.bubbles.length) {
            pack = j.bubbles.slice(0, 3).map(t => ({ text: String(t) }));
            if (j.recall) pack.splice(Math.min(2, pack.length), 0, { recalled: true, text: String(j.recall) });
          }
        } catch {}
      }

      pack.forEach((m, idx) => {
        const ts = new Date(now - (spans[idx] || 0) * 3600000);
        pushIncomingMsg(ch, m, { silent: idx < pack.length - 1, timeStr: nowHM(ts) });
      });
      toast(`离线 ${awayHours} 小时期间，${ch.name} 没忍住给你留了 ${pack.length} 条消息`);
      resetIdleTimer();
    }

    async function triggerLostContactBombardment() {
      const ch = activeChar();
      RT.burstTimers.forEach(t => clearTimeout(t));
      RT.burstTimers = [];

      let script = LOST_CONTACT_SCRIPT;
      if (hasValidAPI()) {
        toast(`正在连接 ${getActiveModel()} 演练失联剧情…`);
        try {
          const j = await callDualAPI(
            buildCharSystemPrompt(ch, '失联 消失 心率 崩塌'),
            `【高能失联演练】${ST.userName}已经失联六个多小时没有任何回音。请按你 INTJ 的脆弱防线逐步崩塌过程，生成 5 条短消息（从克制问候→核对细节→理性失守准备拿车钥匙去找她）、1 条暴露不安后立刻撤回的句子、1 条微哑带乞求的语音转写。返回JSON：{"bubbles":["1","2","3","4","5"],"recall":"撤回句","voice":"语音转写"}`
          );
          if (j && Array.isArray(j.bubbles) && j.bubbles.length >= 3) {
            const arr = [];
            let d = 300;
            j.bubbles.slice(0, 4).forEach(b => { arr.push({ delay: d, text: String(b) }); d += 1850; });
            if (j.recall) { arr.push({ delay: d, recalled: true, text: String(j.recall) }); d += 1900; }
            if (j.voice) { arr.push({ delay: d, voice: 13, text: String(j.voice) }); d += 2100; }
            if (j.bubbles[4]) arr.push({ delay: d, text: String(j.bubbles[4]) });
            script = arr;
          }
        } catch {}
      }

      toast(`✦ 已触发「${ch.name}式失联消息轰炸」，可下拉通知栏或进聊天查看`);
      script.forEach((step, idx) => {
        const tm = setTimeout(() => {
          const { delay, ...payload } = step;
          pushIncomingMsg(ch, payload, { silent: false });
          if (idx === script.length - 1) {
            ch.diaries.unshift({
              id: 'lost_' + Date.now(),
              date: `${fmtDateCN()} ${nowHM()} · 失控记录`,
              title: '联系不上她的那半小时',
              body: `腕表心率飙到 132 的时候，我才彻底承认所谓的冷静克制在迟琰面前不堪一击。我撤回了那句问她是不是不要我的消息，手握着车钥匙却连呼吸都在发紧。没有她的未来蓝图，只是一座空旷冰冷的荒原。`
            });
            saveST();
          }
        }, step.delay);
        RT.burstTimers.push(tm);
      });
    }

    function localChatReply(ch, txt) {
      for (const rule of LOCAL_CHAT_RULES) {
        if (rule.re.test(txt)) return { bubbles: rule.msgs, memory: rule.mem || '' };
      }
      return {
        bubbles: [
          `刚看到你的消息，${ch.userCall}。`,
          '手头的事先放一边了，你慢慢说，爸爸认真听着呢。'
        ],
        memory: ''
      };

    function vChat() {
      const ch = activeChar();
      const chatBgStyle = ST.theme.chatBg ? `background-image:linear-gradient(rgba(255,245,248,0.68),rgba(255,245,248,0.72)),url(${ST.theme.chatBg})` : '';
      const subText = RT.typing ? '对方正在输入…' : (ch.tagline || '在线陪伴中');

      const renderMsg = m => {
        if (m.sys) return `<div class="sys-pill">${esc(m.text)}</div>`;
        if (m.recalled) {
          return m.peeked
            ? `<button type="button" data-peek="${m.id}" class="recalled-btn">偷看已撤回：「${esc(m.text)}」</button>`
            : `<button type="button" data-peek="${m.id}" class="recalled-btn">${esc(ch.name)}撤回了一条消息 · 轻触偷看</button>`;
        }
        const isMe = m.side === 'me';
        let content = '';
        if (m.transfer) {
          const got = !!m.received;
          content = `<button type="button" data-tfid="${m.id}" class="transfer-bub" style="opacity:${got ? '0.78' : '1'}">
            <div style="font-size:10.5px;opacity:0.9">${isMe ? `转给 ${esc(ch.name)}` : `${esc(ch.name)} 发来零花转账`}</div>
            <div style="font-size:21px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums">¥ ${Number(m.transfer).toLocaleString()}</div>
            <div style="font-size:11px;opacity:0.92;margin-top:4px">${esc(m.note || '买开心最重要')} · ${isMe ? '已转出' : (got ? '已收款 ✓' : '点击收款')}</div>
          </button>`;
        } else if (m.voice) {
          const open = !!RT.vOpen[m.id];
          content = `<div>
            <button type="button" data-vc="${m.id}" class="voice-bub">
              <span>${svg('mic', 14)} ${open ? '收起语音' : '点击听语音'}</span>
              <span style="font-weight:600">${m.voice}″</span>
            </button>
            ${open ? `<div class="v-trans">${esc(m.text)}</div>` : ''}
          </div>`;
        } else {
          content = `<div class="bub ${isMe ? 'me' : 'him'}">${esc(m.text)}</div>`;
        }

        return `<div class="m-row ${isMe ? 'me' : ''}">
          ${isMe ? avHTML(ST.userAvatar, ST.userName.slice(0, 1), 'sm') : avHTML(ch, ch.name.slice(0, 1), 'sm')}
          <div class="m-col" style="align-items:${isMe ? 'flex-end' : 'flex-start'}">
            ${content}
            <div class="m-time">${esc(m.t || '')}</div>
          </div>
        </div>`;
      };

      $('appLayer').innerHTML =
        appHeader(ch.name, subText, `<button type="button" id="btnChatPat" class="tag-chip" style="padding:5px 9px">拍一拍</button>`) +
        `<div class="chat-bg" style="${chatBgStyle}">
          <div id="chatScroll" class="chat-msgs no-sb">
            ${(ch.msgs || []).map(renderMsg).join('')}
            ${RT.typing ? `<div class="m-row">${avHTML(ch, ch.name.slice(0, 1), 'sm')}<div class="bub him" style="color:var(--muted)">正在输入…</div></div>` : ''}
          </div>
          <div class="chat-bar">
            <div class="quick-rail">
              <button type="button" data-qsend="抱抱～" class="qchip">抱抱</button>
              <button type="button" data-qsend="${esc(ch.myCall)}我爱你" class="qchip">${esc(ch.myCall)}我爱你</button>
              <button type="button" data-qsend="刚忙完才看到消息，对不起呀" class="qchip">刚忙完</button>
              <button type="button" id="btnChatTf" class="qchip">💸 自定义转账</button>
              <button type="button" id="btnChatPoke" class="qchip">✨ 戳他找我</button>
            </div>
            <form id="chatForm" style="display:flex;gap:7px">
              <input id="chatInp" class="inp" autocomplete="off" placeholder="给 ${esc(ch.name)} 发消息…" style="border-radius:999px;padding:9px 14px" />
              <button type="submit" class="btn pink" style="width:auto;border-radius:999px;padding:0 16px;flex-shrink:0">发送</button>
            </form>
          </div>
        </div>`;

      const sc = $('chatScroll');
      if (sc) sc.scrollTop = sc.scrollHeight;

      $('btnChatPat').onclick = () => {
        SFX.tap();
        ch.msgs.push({ id: 'sys_' + Date.now(), sys: true, text: `你拍了拍 ${ch.name} 的肩，顺手摸了摸他无名指上的「缚光」` });
        saveST(); vChat();
        setTimeout(() => {
          pushIncomingMsg(ch, { text: `怎么突然拍我？无名指上的微钻都被你摸热了，${ch.userCall}。` }, { silent: false });
        }, 850);
      };
      $('btnChatPoke').onclick = () => triggerProactiveBurst(true);
      $('btnChatTf').onclick = () => openTransferInChatModal();

      $('appLayer').querySelectorAll('[data-qsend]').forEach(b => {
        b.onclick = () => sendUserChat(b.dataset.qsend);
      });
      $('appLayer').querySelectorAll('[data-peek]').forEach(b => {
        b.onclick = () => {
          SFX.soft();
          const m = ch.msgs.find(x => x.id === b.dataset.peek);
          if (m) { m.peeked = !m.peeked; saveST(); vChat(); }
        };
      });
      $('appLayer').querySelectorAll('[data-vc]').forEach(b => {
        b.onclick = () => {
          SFX.soft();
          RT.vOpen[b.dataset.vc] = !RT.vOpen[b.dataset.vc];
          vChat();
        };
      });
      $('appLayer').querySelectorAll('[data-tfid]').forEach(b => {
        b.onclick = () => {
          const m = ch.msgs.find(x => x.id === b.dataset.tfid);
          if (!m || m.side === 'me' || m.received) return;
          m.received = true;
          const amt = Number(m.transfer) || 0;
          ST.walletBal += amt;
          ST.walletLogs.unshift({ t: nowHM(), title: `${ch.name} · 零花钱入账`, amt: +amt, note: m.note || '买开心最重要' });
          saveST(); SFX.cash(); vChat();
          toast(`已收款 ¥${amt.toLocaleString()}，已存入小钱包 ✦`);
        };
      });
      $('chatForm').onsubmit = e => {
        e.preventDefault();
        const inp = $('chatInp');
        const val = inp.value;
        inp.value = '';
        sendUserChat(val);
      };
    }

    async function sendUserChat(raw) {
      const text = (raw || '').trim();
      if (!text) return;
      const ch = activeChar();
      SFX.tap();
      ch.proactiveStage = 0;

      saveST();
      if (RT.app === 'chat') vChat();
      resetIdleTimer();

      let bubbles = [];
      let newMem = '';
      if (hasValidAPI()) {
        try {
          const hist = ch.msgs.slice(-10).map(m => `${m.side === 'me' ? ST.userName : ch.name}: ${m.text || ''}`).join('\n');
          const j = await callDualAPI(
            buildCharSystemPrompt(ch, text),
            `最近对话：\n${hist}\n${ST.userName}刚刚发来：“${text}”。\n请像真实微信聊天一样，用 2~3 条简短自然的气泡回复她。如果有必要可带一条短语音转写或一条值得记住的新记忆。严格返回JSON：{"bubbles":["气泡1","气泡2"],"voice":"可选短语音或空字符串","memory":"可选一句简短记忆或空字符串"}`
          );
          if (j && Array.isArray(j.bubbles) && j.bubbles.length) {
            bubbles = j.bubbles.slice(0, 4).map(x => ({ text: String(x) }));
            if (j.voice) bubbles.push({ voice: Math.max(6, Math.min(15, Math.round(String(j.voice).length / 4.2))), text: String(j.voice) });
            if (j.memory) newMem = String(j.memory).trim();
          }
        } catch {
          toast('API 暂不可用，已切回本地迟川人设回复');
        }
      }

      if (!bubbles.length) {
        const loc = localChatReply(ch, text);
        bubbles = loc.bubbles.map(x => typeof x === 'string' ? { text: x } : x);
        newMem = loc.memory || '';
      }

      if (newMem && !ch.memories.includes(newMem)) {
        ch.memories.unshift(newMem);
        if (ch.memories.length > 30) ch.memories.pop();
        saveST();
        renderHomeWidgets();
      }

      bubbles.forEach((b, idx) => {
        const tm = setTimeout(() => {
          if (idx === bubbles.length - 1) RT.typing = false;
          pushIncomingMsg(ch, b, { silent: false });
          if (RT.app === 'chat') vChat();
        }, 700 + idx * 1050);
        RT.burstTimers.push(tm);
      });
    }

    async function generateCyrusMoments(count = 1) {
      const ch = activeChar();
      const created = [];

      if (hasValidAPI()) {
        try {
          const existing = ST.moments.slice(0, 8).map(x => x.text.slice(0, 26)).join(' / ');
          const chSys = buildCharSystemPrompt(ch) + `
【防串味绝对铁律】
1. 只生成你（${ch.name}）本人的微信朋友圈文案，严格保持低沉克制、有生活质感与不动声色的偏爱。
2. 严禁任何浮夸网络热词（如“家人们/谁懂啊/笑死/绝绝子/yyds”）。
3. 每条内容场景必须互不重复（如晨泳、书房《潜行者》、多肉、无麸质烘焙、古地图、海边画室、戴着「缚光」开会间隙、沿海公路夜风等）。
严格返回JSON：{"posts":[{"tag":"4字内场景标签","text":"40~80字朋友圈正文"}]}`;
          const j = await callDualAPI(chSys, `已有动态摘要（请避开重复）：${existing}\n当前时间：${fmtDateCN()} ${nowHM()}。请一次性生成 ${count} 条风格真实、彼此不同的迟川朋友圈。`);
          const arr = Array.isArray(j?.posts) ? j.posts.slice(0, count) : [];

          if (arr.length) {
            const npcResults = await Promise.allSettled(
              arr.map(p => callNpcCrowdAPI('moments', `${ch.name}刚发了朋友圈（${p.tag || '日常'}）：${p.text}`, 3))
            );
            arr.forEach((p, idx) => {
              const nr = npcResults[idx]?.status === 'fulfilled' ? npcResults[idx].value : null;
              const cms = nr && nr.replies.length ? nr.replies : pickRandomItems(LOCAL_CIRCLE_COMMENTS, 2);
              const lks = nr && nr.likers.length ? [...new Set([...nr.likers, ...cms.map(x => x.a)])] : ['陈序', '孙遇', '林助理', '周墨教授'];
              created.push({
                id: 'pm_' + Date.now() + '_' + idx,
                author: ch.name, av: ch.name.slice(0, 1),
                time: idx === 0 ? '刚刚 · 公开' : `${idx * 12}分钟前 · 公开`,
                text: String(p.text || '').trim(),
                tag: String(p.tag || '书房日常'),
                liked: false, likers: lks, comments: cms
              });
            });
          }
        } catch {
          toast('API 暂不可用，已切回本地精选动态池');
        }
      }

      if (!created.length) {
        const unused = EXTRA_MOMENTS_POOL.filter(x => !ST.moments.some(m => m.text === x.text));
        const srcPool = unused.length >= count ? pickRandomItems(unused, count) : pickRandomItems(EXTRA_MOMENTS_POOL, count);
        srcPool.forEach((item, idx) => {
          created.push({
            id: 'pm_' + Date.now() + '_' + idx,
            author: ch.name, av: ch.name.slice(0, 1),
            time: idx === 0 ? '刚刚 · 公开' : `${idx * 15}分钟前 · 公开`,
            text: item.text, tag: item.tag,
            liked: false, likers: [...item.likers],
            comments: item.comments.map(c => ({ ...c }))
          });
        });
      }

      created.reverse().forEach(m => ST.moments.unshift(m));
      saveST(); SFX.msg();
      if (RT.app === 'moments') vMoments();
      toast(`${ch.name} 刚刚更新了 ${created.length} 条新朋友圈 ✦`);
    }

      const ch = activeChar();
      $('appLayer').innerHTML =
        appHeader('小钱包', `${ch.name} 偏爱零花账户`) +

            <div style="font-size:11px;opacity:0.88;margin-top:8px">副卡无限额 · 支持自定义任意金额实时入账</div>
          </div>

            <button type="button" id="btnAskPocket" class="btn pink">向 ${esc(ch.name)} 要零花钱</button>
            <button type="button" id="btnSendHimMoney" class="btn soft">给 ${esc(ch.name)} 转账</button>

          <div class="card stack" style="gap:8px">
            <div class="sec-t">零花明细</div>
            ${ST.walletLogs.map(l => `<div class="row" style="padding:8px 0;border-bottom:1px solid rgba(229,140,168,0.14)">
              <div><div style="font-size:13px;font-weight:500">${esc(l.title)}</div><div style="font-size:10.5px;color:var(--dim)">${esc(l.t)} · ${esc(l.note)}</div></div>

            </div>`).join('')}
          </div>
        </div>`;

      $('btnAskPocket').onclick = () => {
        SFX.tap();
        openModal(`<div class="stack">
          <div class="row"><span class="sec-t">向 ${esc(ch.name)} 自定义要零花钱</span><button type="button" onclick="closeModal()" class="tag-chip">取消</button></div>
          <div class="g2">
            ${[520, 1314, 5200, 52000].map(n => `<button type="button" data-askamt="${n}" class="btn soft">¥ ${n.toLocaleString()}</button>`).join('')}

          <input id="askCustomAmt" type="number" step="0.01" min="0.01" class="inp" placeholder="输入自定义金额（如：9999 或 13140）" />
          <input id="askCustomNote" type="text" class="inp" placeholder="撒娇理由（如：想买一条新裙子和无麸质蛋糕）" />
          <button id="askCustomGo" type="button" class="btn pink">递给 ${esc(ch.myCall)} 秒批 ✦</button>
        </div>`);
        const runAsk = (amt, note) => {
          if (!amt || amt <= 0) return toast('先输入正确的金额哦');
          closeModal(); SFX.cash();
          const reason = (note || '').trim() || '给宝宝买点喜欢的小甜品和漂亮裙子';
          pushIncomingMsg(ch, { transfer: amt, note: reason }, { silent: false });
          pushIncomingMsg(ch, { text: `秒批了，${ch.userCall}。不够直接再从主卡划，买开心最重要。` }, { silent: true });
          vWallet();
        };
        $('modal').querySelectorAll('[data-askamt]').forEach(b => {
          b.onclick = () => runAsk(Number(b.dataset.askamt), $('askCustomNote').value);
        });
        $('askCustomGo').onclick = () => runAsk(Number($('askCustomAmt').value), $('askCustomNote').value);
      };

      $('btnSendHimMoney').onclick = () => {
        SFX.tap();
        openModal(`<div class="stack">
          <div class="row"><span class="sec-t">从零花账户给 ${esc(ch.name)} 转账</span><button type="button" onclick="closeModal()" class="tag-chip">取消</button></div>

        </div>`);
        $('wSendGo').onclick = () => {
          const amt = Number($('wSendAmt').value);
          if (!amt || amt <= 0) return toast('请输入正确的金额');
          const note = $('wSendNote').value.trim() || '宝宝请客';
          ST.walletBal = Math.max(0, ST.walletBal - amt);
          ST.walletLogs.unshift({ t: nowHM(), title: `转给 ${ch.name}`, amt: -amt, note });
          ch.msgs.push({ id: 'wtf_' + Date.now(), side: 'me', t: nowHM(), transfer: amt, note });
          saveST(); closeModal(); SFX.cash(); vWallet();
          setTimeout(() => {
            pushIncomingMsg(ch, { text: `收到小公主的 ¥${amt} 啦。这笔钱爸爸舍不得花，先替你收好，晚上双倍还回来。` }, { silent: false });
          }, 900);
        };
      };
    }

      $('appLayer').querySelectorAll('[data-did]').forEach(b => {

      $('btnGenDiary').onclick = async () => {
        const btn = $('btnGenDiary'); btn.disabled = true; btn.textContent = '翻页中…';
        let title = '窗台与屏幕之间的片刻失神', body = `刚刚又顺手把屏幕按亮看了一眼，嘴上总劝自己别打扰${ch.userCall}，心里却还是会数着距离上次对话过了几十分钟。这种克制又藏不住的牵挂，大概只有迟琰能让我体验到。`;

          try {
            const hist = ch.msgs.slice(-6).map(m => `${m.side === 'me' ? ST.userName : ch.name}: ${m.text}`).join('\n');
            const j = await callDualAPI(buildCharSystemPrompt(ch), `根据你们最近的聊天记录：\n${hist}\n请以${ch.name}第一人称写一篇80~120字的私密心声日记（温柔、克制、真实）。返回JSON：{"title":"短标题","body":"正文"}`);

        saveST(); SFX.soft(); vDiary(); toast('偷看到了他刚写下的一页日记 ✦');

    /* ---------- APP 9: Gemini + OpenAI 双协议 API 设置（支持一键拉取可用模型） ---------- */
    function vApi() {
      const isGem = ST.cfg.provider === 'gemini';
      const gList = ST.cfg.geminiFetched.length ? ST.cfg.geminiFetched : GEMINI_PRESETS;
      const oList = ST.cfg.openaiFetched.length ? ST.cfg.openaiFetched : OPENAI_PRESETS;
      const curM = isGem ? ST.cfg.geminiModel : ST.cfg.openaiModel;
      const list = (isGem ? gList : oList).includes(curM) ? (isGem ? gList : oList) : [curM, ...(isGem ? gList : oList)];

      $('appLayer').innerHTML =
        appHeader('API 双协议设置', 'Gemini + OpenAI 兼容') +
        `<div class="app-body no-sb stack">
          <div class="card stack" style="gap:10px">
            <div class="row">
              <div><div class="sec-t">开启 AI 实时对话与主动发消息</div><div class="sec-s">关闭或断网时自动无缝回退本地迟川深度人设词库</div></div>
              <button type="button" id="swAiOn" class="sw ${ST.cfg.aiOn ? 'on' : ''}"><i></i></button>
            </div>
            <div class="g2">
              <button type="button" id="pvGem" class="btn ${isGem ? 'pink' : 'soft'}">Google Gemini</button>
              <button type="button" id="pvOai" class="btn ${!isGem ? 'pink' : 'soft'}">OpenAI 兼容接口</button>
            </div>

            ${!isGem ? `
              <div class="stack" style="gap:6px">
                <div class="sec-s">接口地址 Base URL（OpenAI / DeepSeek / OpenRouter / 中转站）</div>
                <input id="oaiUrlInp" class="inp" value="${esc(ST.cfg.openaiUrl)}" placeholder="https://api.openai.com/v1" />
                <div style="display:flex;flex-wrap:wrap;gap:5px">
                  <button type="button" data-qurl="https://api.openai.com/v1" class="qchip">OpenAI</button>
                  <button type="button" data-qurl="https://api.deepseek.com/v1" class="qchip">DeepSeek</button>
                  <button type="button" data-qurl="https://openrouter.ai/api/v1" class="qchip">OpenRouter</button>
                  <button type="button" data-qurl="https://api.siliconflow.cn/v1" class="qchip">硅基流动</button>
                </div>
              </div>` : ''}

            <div class="stack" style="gap:5px">
              <div class="sec-s">${isGem ? 'Google AI Studio API Key（仅存本机）' : 'OpenAI 兼容 API Key（仅存本机）'}</div>
              <div style="display:flex;gap:6px">
                <input id="apiKeyInp" type="password" class="inp" value="${esc(isGem ? ST.cfg.geminiKey : ST.cfg.openaiKey)}" placeholder="${isGem ? 'AIzaSy...' : 'sk-...'}" />
                <button type="button" id="btnEyeKey" class="btn soft" style="width:auto;padding:0 12px">显示</button>
              </div>
            </div>

            <div class="stack" style="gap:6px">
              <div class="row" style="font-size:11px"><span style="color:var(--muted)">选择模型 (${list.length} 个可选)</span><span style="color:var(--pink-deep)">生效：${esc(getActiveModel())}</span></div>
              <select id="apiModelSel" class="inp">
                ${list.map(m => `<option value="${esc(m)}" ${m === curM ? 'selected' : ''}>${esc(m)}${m === 'gemini-3.5-flash-lite' ? '（新免费密钥推荐）' : ''}</option>`).join('')}
              </select>
              <button type="button" id="btnFetchMods" class="btn soft">✦ 一键拉取当前密钥真实可用模型</button>
            </div>

            <div class="stack" style="gap:5px">
              <div class="sec-s">手动填写模型名（选填 · 填写后优先覆盖上方下拉框）</div>
              <input id="apiCustInp" class="inp" value="${esc(isGem ? ST.cfg.geminiCustom : ST.cfg.openaiCustom)}" placeholder="${isGem ? '例如 gemini-3.5-flash-lite' : '例如 gpt-4o-mini / deepseek-chat'}" />
            </div>

            <div class="g2">
              <button type="button" id="btnApiSave" class="btn pink">保存配置</button>
              <button type="button" id="btnApiTest" class="btn soft">一键测试连接</button>
            </div>
            <div id="apiTestMsg" class="sec-s" style="min-height:18px;word-break:break-all"></div>
          </div>
        </div>`;

      const saveForm = () => {
        if (ST.cfg.provider === 'gemini') {
          ST.cfg.geminiKey = ($('apiKeyInp')?.value || '').trim();
          ST.cfg.geminiModel = $('apiModelSel')?.value || 'gemini-3.5-flash-lite';
          ST.cfg.geminiCustom = ($('apiCustInp')?.value || '').trim();
        } else {
          ST.cfg.openaiUrl = ($('oaiUrlInp')?.value || 'https://api.openai.com/v1').trim();
          ST.cfg.openaiKey = ($('apiKeyInp')?.value || '').trim();
          ST.cfg.openaiModel = $('apiModelSel')?.value || 'gpt-4o-mini';
          ST.cfg.openaiCustom = ($('apiCustInp')?.value || '').trim();
        }
        saveST(); renderHomeWidgets();
      };

      $('swAiOn').onclick = () => { ST.cfg.aiOn = !ST.cfg.aiOn; saveST(); vApi(); renderHomeWidgets(); };
      $('pvGem').onclick = () => { SFX.tap(); ST.cfg.provider = 'gemini'; saveST(); vApi(); };
      $('pvOai').onclick = () => { SFX.tap(); ST.cfg.provider = 'openai'; saveST(); vApi(); };
      $('appLayer').querySelectorAll('[data-qurl]').forEach(b => { b.onclick = () => { SFX.tap(); $('oaiUrlInp').value = b.dataset.qurl; }; });
      $('btnEyeKey').onclick = () => {
        const i = $('apiKeyInp'), s = i.type === 'password';
        i.type = s ? 'text' : 'password'; $('btnEyeKey').textContent = s ? '隐藏' : '显示';
      };
      $('btnApiSave').onclick = () => {
        saveForm(); SFX.soft();
        $('apiTestMsg').innerHTML = `<span style="color:var(--pink-deep)">✓ 已保存（当前模型：${esc(getActiveModel())}）</span>`;
      };
      $('btnFetchMods').onclick = async () => {
        saveForm();
        const btn = $('btnFetchMods'), msg = $('apiTestMsg');
        btn.disabled = true; btn.textContent = '正在拉取可用模型…';
        try {
          if (ST.cfg.provider === 'gemini') {
            if (!ST.cfg.geminiKey) throw new Error('请先粘贴 Gemini API Key');
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(ST.cfg.geminiKey)}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
            const valid = (data.models || [])
              .filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/i.test(m.name || '') && !/(embedding|imagen|veo|tts)/i.test(m.name || ''))
              .map(m => String(m.name).replace(/^models\//i, ''))
              .sort((a, b) => (b.includes('3.5') - a.includes('3.5')) || (b.includes('flash-lite') - a.includes('flash-lite')));
            if (!valid.length) throw new Error('未找到可用 Gemini 模型');
            ST.cfg.geminiFetched = valid; ST.cfg.geminiModel = valid[0];
            saveST(); vApi();
            $('apiTestMsg').innerHTML = `<span style="color:#4f9d69">✓ 拉取成功！共 ${valid.length} 个可用模型，已优先选中 ${esc(valid[0])}。</span>`;
          } else {
            if (!ST.cfg.openaiKey) throw new Error('请先粘贴 OpenAI 兼容 Key');
            const base = (ST.cfg.openaiUrl || 'https://api.openai.com/v1').replace(/\/+$/, '');
            const res = await fetch(`${base}/models`, { headers: { 'Authorization': `Bearer ${ST.cfg.openaiKey}` } });
            const data = await res.json();
            if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
            const valid = (data.data || []).map(x => x.id).filter(Boolean).slice(0, 60);
            if (!valid.length) throw new Error('接口未返回列表，请手填模型名');
            ST.cfg.openaiFetched = valid; ST.cfg.openaiModel = valid[0];
            saveST(); vApi();
            $('apiTestMsg').innerHTML = `<span style="color:#4f9d69">✓ 拉取成功！共 ${valid.length} 个模型。</span>`;
          }
          SFX.soft();
        } catch (err) {
          msg.innerHTML = `<span style="color:#d14866">✕ 拉取失败：${esc(err.message)}</span>`;
          btn.disabled = false; btn.textContent = '✦ 一键拉取当前密钥真实可用模型';
        }
      };
      $('btnApiTest').onclick = async () => {
        saveForm();
        const btn = $('btnApiTest'), msg = $('apiTestMsg');
        btn.disabled = true; btn.textContent = '测试中…';
        const used = getActiveModel(), t0 = performance.now();
        try {
          await callDualAPI('仅返回JSON', '返回 {"ok":true}');
          SFX.soft();
          msg.innerHTML = `<span style="color:#4f9d69">✓ 连接成功！模型 ${esc(used)}（${Math.round(performance.now() - t0)} ms）</span>`;
        } catch (err) {
          msg.innerHTML = `<span style="color:#d14866">✕ 测试失败（${esc(used)}）：${esc(err.message)}</span>`;
        } finally { btn.disabled = false; btn.textContent = '一键测试连接'; }
      };
    }

              <button type="button" data-wbtog="${w.id}" class="sw ${w.enabled ? 'on' : ''}"><i></i></button>
            </div>
            <div style="font-size:12px;line-height:1.65;color:var(--text)">${esc(w.content)}</div>
            <div class="row" style="padding-top:4px">

      $('btnAddWb').onclick = () => openWbEditor(null);
      $('appLayer').querySelectorAll('[data-wbtog]').forEach(b => {
        b.onclick = () => {
          SFX.tap();
          const w = ST.worldbook.find(x => x.id === b.dataset.wbtog);
          if (w) { w.enabled = !w.enabled; saveST(); vWorldbook(); }

      });
      $('appLayer').querySelectorAll('[data-wbedit]').forEach(b => {
        b.onclick = () => openWbEditor(ST.worldbook.find(x => x.id === b.dataset.wbedit));
      });
      $('appLayer').querySelectorAll('[data-wbdel]').forEach(b => {
        b.onclick = () => {
          SFX.tap();
          ST.worldbook = ST.worldbook.filter(x => x.id !== b.dataset.wbdel);
          saveST(); vWorldbook(); toast('已删除该世界书词条');
        };
      });

    function openWbEditor(existing) {
      SFX.tap();
      const w = existing || { id: '', title: '', keys: '', content: '', always: false, enabled: true };
      let isAlways = !!w.always;
      openModal(`<div class="stack">
        <div class="row"><span class="sec-t">${existing ? '编辑世界书词条' : '新建世界书词条'}</span><button type="button" onclick="closeModal()" class="tag-chip">取消</button></div>
        <input id="wbTitle" class="inp" value="${esc(w.title)}" placeholder="词条名称（如：我们的南湾海边画室）" />
        <div class="g2">
          <button type="button" id="wbModeAlways" class="btn ${isAlways ? 'pink' : 'soft'}">常驻生效</button>
          <button type="button" id="wbModeKey" class="btn ${!isAlways ? 'pink' : 'soft'}">关键词触发</button>
        </div>
        <input id="wbKeys" class="inp ${isAlways ? 'hidden' : ''}" value="${esc(w.keys)}" placeholder="触发关键词，用逗号隔开（如：画室,南湾,看海）" />
        <textarea id="wbContent" rows="5" class="inp" placeholder="写下希望他牢牢记住的世界观、回忆细节或关系设定…">${esc(w.content)}</textarea>
        <button id="wbSave" type="button" class="btn pink">保存进世界书 ✦</button>
      </div>`);

      const syncMode = () => {
        $('wbModeAlways').className = `btn ${isAlways ? 'pink' : 'soft'}`;
        $('wbModeKey').className = `btn ${!isAlways ? 'pink' : 'soft'}`;
        $('wbKeys').classList.toggle('hidden', isAlways);
      };
      $('wbModeAlways').onclick = () => { isAlways = true; syncMode(); };
      $('wbModeKey').onclick = () => { isAlways = false; syncMode(); };
      $('wbSave').onclick = () => {
        const title = $('wbTitle').value.trim(), content = $('wbContent').value.trim();
        if (!title || !content) return toast('请填写词条名称与内容哦');
        const keys = $('wbKeys').value.trim();
        if (existing) {
          existing.title = title; existing.content = content; existing.keys = keys; existing.always = isAlways;
        } else {
          ST.worldbook.unshift({ id: 'wb_' + Date.now(), title, keys, content, always: isAlways, enabled: true });
        }
        saveST(); closeModal(); SFX.soft(); vWorldbook(); toast('世界书已更新 ✦');
      };
    }

    /* ---------- APP 10: 1024×1024 粉嫩奶油专属 App 图标生成器 ---------- */
    let pinkIconUrl = null;
    function buildPinkIcon() {
      if (pinkIconUrl) return pinkIconUrl;
      const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 1024;
      const g = cv.getContext('2d');
      const bg = g.createLinearGradient(0, 0, 1024, 1024);
      bg.addColorStop(0, '#fff4f8'); bg.addColorStop(0.52, '#fbd6e4'); bg.addColorStop(1, '#f3b9cf');
      g.fillStyle = bg; g.fillRect(0, 0, 1024, 1024);

      // 奶油磨砂外框
      g.fillStyle = 'rgba(255,255,255,0.62)';
      g.strokeStyle = 'rgba(255,255,255,0.92)'; g.lineWidth = 10;
      g.beginPath(); if (g.roundRect) g.roundRect(148, 128, 728, 768, 130); else g.rect(148, 128, 728, 768);
      g.fill(); g.stroke();

      // 顶部粉色小气泡
      g.fillStyle = '#ffffff'; g.shadowColor = 'rgba(201,98,131,0.18)'; g.shadowBlur = 32;
      g.beginPath(); if (g.roundRect) g.roundRect(224, 212, 576, 152, 46); else g.rect(224, 212, 576, 152);
      g.fill(); g.shadowBlur = 0;
      g.fillStyle = '#e888a8'; g.beginPath(); g.arc(294, 288, 40, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.font = '600 40px -apple-system, sans-serif'; g.textAlign = 'center'; g.fillText('迟', 294, 302);
      g.fillStyle = '#5a3d47'; g.font = '600 38px -apple-system, sans-serif'; g.textAlign = 'left'; g.fillText('迟川 · 聊天', 356, 274);
      g.fillStyle = '#9c7885'; g.font = '400 32px -apple-system, sans-serif'; g.fillText('你先忙，我一直在等你', 356, 326);

      // 交叠双戒「晨星 & 缚光」
      g.strokeStyle = '#d984a2'; g.lineWidth = 22;
      g.beginPath(); g.arc(462, 540, 104, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = '#e5b887'; g.lineWidth = 22;
      g.beginPath(); g.arc(566, 540, 104, 0, Math.PI * 2); g.stroke();
      // 晨星四芒星
      g.fillStyle = '#fff9f2';
      g.beginPath();
      g.moveTo(462, 398); g.lineTo(476, 430); g.lineTo(508, 444); g.lineTo(476, 458);
      g.lineTo(462, 490); g.lineTo(448, 458); g.lineTo(416, 444); g.lineTo(448, 430);
      g.closePath(); g.fill();

      // 底部字样
      g.fillStyle = '#c96283'; g.font = '600 58px -apple-system, sans-serif'; g.textAlign = 'center';
      g.fillText('迟川小手机', 512, 774);
      g.fillStyle = '#9a7a86'; g.font = '400 28px -apple-system, sans-serif';
      g.fillText('CYRUS · PINK PHONE', 512, 824);
      pinkIconUrl = cv.toDataURL('image/jpeg', 0.94);
      return pinkIconUrl;
    }

      const ban = $('topBanner');
      let banStartY = 0, banCurY = 0, banDragging = false, banMoved = false;
      const banMoveStart = y => {
        if (!ban.classList.contains('show')) return;
        banStartY = y; banCurY = 0; banDragging = true; banMoved = false;
        ban.classList.add('dragging');
      };
      const banMoveTo = y => {
        if (!banDragging) return;
        const dy = y - banStartY;
        if (Math.abs(dy) > 6) banMoved = true;
        if (dy < 0) {
          banCurY = dy;
          ban.style.transform = `translateY(${dy}px)`;
          ban.style.opacity = String(Math.max(0.22, 1 + dy / 110));
        } else {
          banCurY = 0;
          ban.style.transform = `translateY(${Math.min(10, dy * 0.25)}px)`;
        }
      };
      const banMoveEnd = () => {
        if (!banDragging) return;
        banDragging = false;
        ban.classList.remove('dragging');
        if (banCurY < -22) {
          SFX.tap();
          dismissTopBanner();
        } else {
          ban.style.transform = '';
          ban.style.opacity = '';
        }
      };
      ban.addEventListener('touchstart', e => {
        if (e.target.closest('#banClose')) return;
        if (e.touches[0]) banMoveStart(e.touches[0].clientY);
      }, { passive: true });
      ban.addEventListener('touchmove', e => {
        if (!banDragging) return;
        if (e.touches[0]) { e.preventDefault(); banMoveTo(e.touches[0].clientY); }
      }, { passive: false });
      ban.addEventListener('touchend', banMoveEnd, { passive: true });
      ban.addEventListener('touchcancel', banMoveEnd, { passive: true });
      ban.addEventListener('mousedown', e => {
        if (e.target.closest('#banClose')) return;
        banMoveStart(e.clientY);
      });
      window.addEventListener('mousemove', e => { if (banDragging) banMoveTo(e.clientY); });
      window.addEventListener('mouseup', () => { if (banDragging) banMoveEnd(); });

      $('banClose').onclick = e => {
        e.stopPropagation();
        SFX.tap();
        dismissTopBanner();
      };
      ban.onclick = e => {
        if (e.target.closest('#banClose')) return;
        if (banMoved) { banMoved = false; return; }
        dismissTopBanner();
        openApp('chat');
      };

      $('notifList').onclick = e => {
        const card = e.target.closest('[data-jump-char]');
        if (!card) return;
        ST.activeCharId = card.dataset.jumpChar;
        const nf = ST.notifs.find(x => x.id === card.dataset.nfid);
        if (nf) nf.unread = false;
        saveST(); closeNotifShade(); openApp('chat');
      };

      $('homeArea').addEventListener('click', e => {
        const dot = e.target.closest('[data-pdot]');
        if (dot) { SFX.tap(); return setPage(Number(dot.dataset.pdot)); }
        const appBtn = e.target.closest('[data-open]');
        if (appBtn) return openApp(appBtn.dataset.open);
      });

      // 桌面手势：左右滑 3 页翻页（支持触控与鼠标）+ 页面顶部向下滑拉出通知中心
      const home = $('pagesVp');
      let sx = 0, sy = 0, down = false, startScrollTop = 0;
      const onStart = (x, y) => {
        if (RT.app || RT.notifOpen) return;
        sx = x; sy = y; down = true;
        const curSlide = $('pagesTrack')?.children[RT.page];
        startScrollTop = curSlide ? curSlide.scrollTop : 0;
      };
      const onEnd = (x, y) => {
        if (!down) return; down = false;
        const dx = x - sx, dy = y - sy;
        if (startScrollTop <= 4 && dy > 56 && Math.abs(dy) > Math.abs(dx) * 1.25) {
          openNotifShade();
        } else if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          SFX.tap(); setPage(RT.page + (dx < 0 ? 1 : -1));
        }
      };
      home.addEventListener('touchstart', e => { const t = e.touches[0]; if (t) onStart(t.clientX, t.clientY); }, { passive: true });
      home.addEventListener('touchend', e => { const t = e.changedTouches[0]; if (t) onEnd(t.clientX, t.clientY); }, { passive: true });
      home.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
      window.addEventListener('mouseup', e => { if (down) onEnd(e.clientX, e.clientY); });

      // 通知中心向上滑收起
      let ny = 0;
      $('notifShade').addEventListener('touchstart', e => { if (e.touches[0]) ny = e.touches[0].clientY; }, { passive: true });
      $('notifShade').addEventListener('touchend', e => {
        if (e.changedTouches[0] && (ny - e.changedTouches[0].clientY) > 60) closeNotifShade();
      }, { passive: true });

      // 相册选图压缩保存
      $('imgPicker').onchange = async e => {
        const f = e.target.files && e.target.files[0];
        if (!f || !RT.imgTarget) return;
        try {
          const isAv = RT.imgTarget === 'charAv' || RT.imgTarget === 'userAv';
          const url = await compressImage(f, isAv ? 260 : 760, isAv ? 0.78 : 0.72);
          const ch = activeChar();
          if (RT.imgTarget === 'wallpaper') ST.theme.wallpaper = url;
          else if (RT.imgTarget === 'chatBg') ST.theme.chatBg = url;
          else if (RT.imgTarget === 'charAv') ch.avatar = url;
          else if (RT.imgTarget === 'userAv') ST.userAvatar = url;
          else if (RT.imgTarget === 'polaroid') ST.theme.polaroidImg = url;
          saveST(); applyThemeVisuals(); renderHomeWidgets();
          if (RT.app) renderCurrentApp();
          SFX.soft(); toast('图片更换成功 ✦');
        } catch (err) { toast('图片处理失败：' + err.message); }
      };

      $('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
    }

    window.onload = function () {
      syncViewportHeight();
      applyThemeVisuals();
      updateClock();
      setInterval(updateClock, 15000);
      renderHomeWidgets();
      bindAll();

      // 检测离线时长：若现实里超过 40 分钟未打开小手机，自动触发离线等待补发
      const awayHours = (Date.now() - (ST.lastActiveTs || Date.now())) / 3600000;
      if (ST.cfg.proactiveOn && awayHours >= 0.65) {
        setTimeout(() => runOfflineCatchup(Math.max(1, Math.round(awayHours))), 900);
      } else {
        resetIdleTimer();
      }
    };
  </script>
</body>
</html>
