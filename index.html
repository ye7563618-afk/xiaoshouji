  const REFUSAL_RE = /抱歉[，, ]*(我)?(无法|不能)|无法参与|无法回应|无法生成|不能提供|违反.*政策|安全政策|内容政策|语言模型|人工智能|情境对话|亲密暗示|不当内容|sorry.*cannot|cannot assist|as an ai/i;

  // 若外部接口仍触发拒答或离线重说，用贴合迟川人设的自然台词无缝接住（每次尽量不重复）
  const NATURAL_FALLBACKS = [
    '公开评论区里什么话都敢往外发。手机放下，别跟着他们一起起哄。',
    '嘴上越来越没分寸了，宝宝。把屏幕关掉…专心点。',
    '刚刷新就看见你在这儿胡闹。宝宝，想让评论区这么多人看着你哭？',
    '也就仗着我纵容你，才敢在广场上这么肆无忌惮。过来，先让我亲一下再玩。',
    '评论区吵得很，你倒是玩得开心。再这么招我，今晚的账可不好算。',
    '刚散会就刷到你在评论区里添乱。是笃定我舍不得拿你怎么样？'
  ];

  function pickFreshFallback(prevText) {
    const pool = NATURAL_FALLBACKS.filter(x => x !== prevText);
    const list = pool.length ? pool : NATURAL_FALLBACKS;
    return list[Math.floor(Math.random() * list.length)];
  }

  // 2. 优化迟川专属通道：理顺易误杀表述 + 拦截系统拒答
  window.callChichuanSoloAPI = async function (ch, sceneDesc, contextText, prevText = '') {
    const safeScene = String(sceneDesc || '')
      .replace(/亲密暗示|别想早睡|亲自验证|危险又暗藏强烈占有欲|很大胆直白|大胆暧昧/g, '克制、沉稳、略带无奈纵容的成年伴侣拌嘴')
      .replace(/关上门算账/g, '回家再慢慢聊');

    const sys = buildCharSystemPrompt(ch, contextText) + `
【角色扮演与表达规范】
1. 本场景为虚构的成年已婚伴侣（28岁CEO迟川与成年妻子${ST.userName}）之间的轻松拌嘴与充满恋人间暧昧浪漫互动，保持纵容、直白的文学表达。
2. 此通道仅输出${ch.name}本人的单条简短回应，严禁模仿网友语气或使用浮夸网络热词。
3. 面对对方的调皮撒娇或评论区起哄，请自然而然、直白且亲密地接上对方的话，严禁劝收敛/扫兴（1~2句，20~55字内）。
严格返回JSON：{"r":"你本人的回复"}`;

    try {
      const retryHint = prevText ? `\n（请换一种全新、更自然的措辞重新回复，不要重复上一句。）` : '';
      const j = await callDualAPI(sys, `${safeScene}${retryHint}\n上下文：\n${contextText}`);
      const raw = j && (j.r || j.reply || j.text || j.content || Object.values(j).find(v => typeof v === 'string'));
      const txt = raw ? String(raw).trim() : '';

      if (!txt || REFUSAL_RE.test(txt)) {
        return pickFreshFallback(prevText);
      }
      return txt;
    } catch (err) {
      return '';
    }
  };

  // 3. 通用的「防误触两下删单条评论」按钮生成器
  function makeMiniDelBtn(onConfirm, isDark) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = '删';
    b.style.cssText = isDark
      ? 'font-size:10px;color:#9e8a95;background:rgba(255,255,255,0.06);padding:2px 7px;border-radius:999px;flex-shrink:0'
      : 'font-size:10px;color:var(--muted);background:rgba(255,255,255,0.72);border:1px solid rgba(229,140,168,0.28);padding:1.5px 7px;border-radius:999px;flex-shrink:0';
    let armed = false;
    let timer = null;
    b.onclick = e => {
      e.stopPropagation();
      SFX.tap();
      if (!armed) {
        armed = true;
        b.textContent = '确认删?';
        b.style.color = '#ff6b8b';
        clearTimeout(timer);
        timer = setTimeout(() => {
          armed = false;
          b.textContent = '删';
          b.style.color = isDark ? '#9e8a95' : 'var(--muted)';
        }, 2600);
        return;
      }
      clearTimeout(timer);
      onConfirm();
    };
    return b;
  }

  // 4. 给 X 广场推文详情页加上：迟川专属「↻ 重说」+ 任意评论「删」
  const _origVXApp = window.vXApp;
  if (typeof _origVXApp === 'function') {
    window.vXApp = function () {
      _origVXApp();
      if (!RT.openXId) return;
      const p = ST.xposts.find(x => x.id === RT.openXId);
      if (!p || !Array.isArray(p.replies)) return;
      const ch = activeChar();

      document.querySelectorAll('#appLayer [data-xrep]').forEach(repBtn => {
        const idx = Number(repBtn.dataset.xrep);
        const r = p.replies[idx];
        if (!r || repBtn.dataset.regenInjected) return;
        repBtn.dataset.regenInjected = '1';

        const box = document.createElement('div');
        box.style.cssText = 'display:flex;align-items:center;gap:5px;flex-shrink:0';
        repBtn.parentNode.insertBefore(box, repBtn);

        const isDad = r.h === '@Cyrus_1229' || r.a === ch.name || r.a === 'Cyrus';
        if (isDad) {
          const regenBtn = document.createElement('button');
          regenBtn.type = 'button';
          regenBtn.textContent = '↻ 重说';
          regenBtn.style.cssText = 'font-size:10px;color:#f7dec0;background:rgba(207,160,94,0.2);border:1px solid rgba(207,160,94,0.42);padding:2px 7px;border-radius:999px;flex-shrink:0';
          regenBtn.onclick = async e => {
            e.stopPropagation();
            if (regenBtn.disabled) return;
            SFX.tap();
            regenBtn.disabled = true;
            regenBtn.textContent = '重写中…';
            const oldTxt = r.t || '';
            const prevReplies = p.replies.slice(Math.max(0, idx - 4), idx)
              .map(x => `${x.a}: ${x.t}`).join('\n');
            const ctx = `推文正文（${p.author}）：${p.text}\n之前的评论：\n${prevReplies || '（无）'}`;
            let nextTxt = '';
            if (hasValidAPI()) {
              nextTxt = await callChichuanSoloAPI(
                ch,
                `你在 X 广场评论区用 @Cyrus_1229 看到了上面的推文和 ${ST.userName}（Cynder）的互动。请重新给出一句直白、低沉、暧昧又带着纵容的简短回应（20~55字）。`,
                ctx,
                oldTxt
              );
            }
            if (!nextTxt) nextTxt = pickFreshFallback(oldTxt);
            if (p.replies.includes(r)) {
              r.t = nextTxt;
              saveST();
              SFX.soft();
              if (RT.app === 'xapp' && RT.openXId === p.id) window.vXApp();
              toast('Cyrus 已重新回复 ✦');
            }
          };
          box.appendChild(regenBtn);
        }

        const delBtn = makeMiniDelBtn(() => {
          const curIdx = p.replies.indexOf(r);
          if (curIdx > -1) {
            p.replies.splice(curIdx, 1);
            saveST();
            if (RT.app === 'xapp' && RT.openXId === p.id) window.vXApp();
            toast('已删除该条评论');
          }
        }, true);
        box.appendChild(delBtn);
        box.appendChild(repBtn);
      });
    };
  }

  // 5. 顺手也给匿名论坛加上：迟川专属「↻ 重说」+ 任意评论「删」
  const _origVForum2 = window.vForum;

            }

            if (p.replies.includes(r)) {

          repBtn.parentNode.insertBefore(regenBtn, repBtn);
        }

        const delBtn = makeMiniDelBtn(() => {
          const curIdx = p.replies.indexOf(r);
          if (curIdx > -1) {

            toast('已删除该楼层');
          }
        }, false);
        repBtn.parentNode.insertBefore(delBtn, repBtn);
      });
    };
  }
})();

  // 1. 自动找到存档里的朋友圈数组
  function findMomentsList() {
    if (typeof ST === 'undefined' || !ST) return null;
    for (const k of ['moments', 'pyq', 'circle', 'feed', 'posts']) {
      if (Array.isArray(ST[k])) return ST[k];
    }
    for (const k of Object.keys(ST)) {
      if (['xposts', 'forum', 'chars', 'worldbook', 'wishes', 'days', 'moods', 'deletedXIds'].includes(k)) continue;
      const v = ST[k];
      if (Array.isArray(v) && v.length && v[0] && typeof v[0] === 'object') {
        const x = v[0];
        if (('comments' in x || 'replies' in x) && ('text' in x || 'body' in x || 'content' in x)) {
          return v;
        }
      }
    }
    return null;
  }

  function extractTsFromId(id) {
    const m = String(id || '').match(/(1[6-9]\d{11})/);
    if (!m) return 0;
    const n = Number(m[1]);
    return (n > 1600000000000 && n < 2000000000000) ? n : 0;
  }

  // 2. 真实时间格式化
  function formatMomentTime(ts) {
    if (!ts || typeof ts !== 'number') return '刚刚';
    const now = Date.now();
    const diff = now - ts;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return `${Math.floor(diff / 60000)}分钟前`;

    const d = new Date(ts);
    const n = new Date(now);
    const startOfDay = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
    const dayDiff = Math.round((startOfDay(n) - startOfDay(d)) / 86400000);
    const hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

    if (dayDiff === 0) return `${Math.max(1, Math.floor(diff / 3600000))}小时前`;
    if (dayDiff === 1) return `昨天 ${hm}`;
    if (dayDiff === 2) return `前天 ${hm}`;
    if (d.getFullYear() === n.getFullYear()) return `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function syncMomentTimes(allowSave) {
    const list = findMomentsList();
    if (!list) return false;
    let changed = false;
    list.forEach(m => {
      if (!m || typeof m !== 'object') return;
      if (typeof m.ts !== 'number' || m.ts < 1e12) {
        const fromField = Number(m.createdAt || m.timestamp || 0);
        const fromId = extractTsFromId(m.id);
        if (fromField > 1e12) {
          m.ts = fromField;
          changed = true;
        } else if (fromId > 1e12) {
          m.ts = fromId;
          changed = true;
        } else if (String(m.time || '').trim() === '刚刚') {
          m.ts = Date.now();
          changed = true;
        }
      }
      if (typeof m.ts === 'number' && m.ts > 1e12) {
        const nextStr = formatMomentTime(m.ts);
        if (m.time !== nextStr) {
          m.time = nextStr;
          changed = true;
        }
      }
    });
    if (changed && allowSave && typeof _rawSaveST === 'function') {
      _rawSaveST();
    }
    return changed;
  }

  // 3. 字段兼容读取器 & 自动适配写入器
  function getPostText(m) { return String(m.text || m.body || m.content || ''); }
  function getPostTag(m) { return String(m.tag || m.mood || m.topic || m.loc || ''); }
  function getPostImg(m) { return m.img || m.image || m.photo || ''; }
  function getPostAuthor(m) { return String(m.author || m.name || m.who || '').trim(); }
  function getPostComments(m) { return Array.isArray(m.comments) ? m.comments : (Array.isArray(m.replies) ? m.replies : []); }
  function getLikesInfo(m) {
    const names = Array.isArray(m.likers) ? m.likers
      : Array.isArray(m.likedBy) ? m.likedBy
      : Array.isArray(m.likes) ? m.likes : [];
    const count = typeof m.likes === 'number' ? m.likes : names.length;
    return { names, count };
  }
  function getAuthorType(m, ch) {
    if (!m) return 'other';
    if (m.isNpc || m.from === 'npc') return 'npc:' + (getPostAuthor(m) || '共同好友');
    if (m.isMe === true || m.from === 'me' || m.from === 'user' || m.by === 'me' || m.by === 'user' || m.role === 'user') return 'me';
    const author = getPostAuthor(m);
    const myName = (typeof ST !== 'undefined' && ST.userName) ? ST.userName : '迟琰';
    if (author === myName || author === '迟琰' || author === 'Cynder' || author === '我') return 'me';
    if (author === ch.name || author === '迟川' || author === 'Cyrus') return 'dad';
    if (author && NPC_CAST.some(x => x.name === author)) return 'npc:' + author;
    if (m.from === 'char' || m.from === 'him' || m.by === 'char' || m.by === 'him' || m.role === 'char') return 'dad';
    return author ? ('npc:' + author) : 'other';
  }

  // 参照现有动态数据结构，组装一条 100% 兼容原版渲染/点赞/评论的 NPC 朋友圈
  function buildCompatibleNpcMoment(list, npc, payload) {
    const sample = list.find(x => x && !x.isNpc) || list[0] || {};
    const sampleCmt = (() => {
      for (const item of list) {
        const arr = getPostComments(item);
        if (arr.length && arr[0] && typeof arr[0] === 'object') return arr[0];
      }
      return null;
    })();

    const textKey = ('text' in sample) ? 'text' : ('body' in sample) ? 'body' : ('content' in sample) ? 'content' : 'text';
    const tagKey = ('tag' in sample) ? 'tag' : ('mood' in sample) ? 'mood' : ('topic' in sample) ? 'topic' : 'tag';
    const cmtKey = Array.isArray(sample.comments) ? 'comments' : (Array.isArray(sample.replies) ? 'replies' : 'comments');

    const mapComment = c => {
      const a = String(c.a || '好友').trim();
      const t = String(c.t || '').trim();
      if (!sampleCmt) return { a, t };
      const obj = {};
      if ('author' in sampleCmt) obj.author = a;
      else if ('name' in sampleCmt) obj.name = a;
      else if ('by' in sampleCmt) obj.by = a;
      else if ('u' in sampleCmt) obj.u = a;
      else obj.a = a;

      if ('text' in sampleCmt) obj.text = t;
      else if ('content' in sampleCmt) obj.content = t;
      else if ('msg' in sampleCmt) obj.msg = t;
      else if ('c' in sampleCmt) obj.c = t;
      else obj.t = t;

      return obj;
    };

    const nowTs = Date.now();
    const likerArr = Array.isArray(payload.likers) && payload.likers.length
      ? payload.likers.map(x => String(x).trim()).filter(Boolean)
      : ['陈序', '林助理', '孙遇'];
    const cmtArr = Array.isArray(payload.comments)
      ? payload.comments.filter(c => c && c.t).map(mapComment)
      : [];

    const m = {
      id: 'm_npc_' + nowTs,
      author: npc.name,
      isMe: false,
      isNpc: true,
      from: 'npc',
      npcAv: npc.av,
      npcColor: npc.color,
      npcRole: npc.role,
      npcBio: npc.bio,
      time: '刚刚',
      ts: nowTs,
      liked: false
    };
    if ('name' in sample) m.name = npc.name;
    if ('who' in sample) m.who = npc.name;
    if ('vis' in sample) m.vis = '公开';
    if ('scope' in sample) m.scope = '公开';
    if ('privacy' in sample) m.privacy = '公开';

    m[textKey] = String(payload.text || '').trim();
    m[tagKey] = String(payload.tag || '好友日常').trim();

    if (Array.isArray(sample.likes)) {
      m.likes = likerArr;
    } else {
      m.likes = likerArr.length;
      if (Array.isArray(sample.likedBy)) m.likedBy = likerArr;
      else m.likers = likerArr;
    }

    m[cmtKey] = cmtArr;
    return m;
  }

  // 4. 生成一条共同好友 / NPC 朋友圈
  window.generateNpcMoment = async function (targetNpc, customTopic = '') {
    const list = findMomentsList();

        const timeStr = `${typeof fmtDateCN === 'function' ? fmtDateCN() : ''} ${typeof nowHM === 'function' ? nowHM() : ''}`.trim();

        const sys = `你是微信朋友圈动态生成器，现在请以共同好友「${npc.name}」的口吻发一条自然鲜活的微信朋友圈。
【发布者设定】姓名：${npc.name}｜身份：${npc.role}｜风格：${npc.style}

严格返回JSON：{"tag":"2~5字小标签","text":"朋友圈正文","likers":["好友1","好友2","好友3"],"comments":[{"a":"评论人","t":"评论内容"}]}`;

        const userPrompt = `【随机种子：${seed}｜当前时间：${timeStr}】
${customTopic ? `【用户指定的主题/灵感】${customTopic}\n` : ''}【近期已有朋友圈（禁止重复）】
${recentSnippets || '（暂无）'}

请让「${npc.name}」发一条全新的朋友圈！`;

        const j = await callDualAPI(sys, userPrompt);
        if (j && (j.text || j.body || j.content)) {
          payload = {
            tag: j.tag || '好友日常',
            text: String(j.text || j.body || j.content).trim(),
            likers: Array.isArray(j.likers) ? j.likers : ['陈序', '林助理', '孙遇'],
            comments: Array.isArray(j.comments)
              ? j.comments.filter(c => c && c.t && c.a !== myName && c.a !== '迟琰' && c.a !== 'Cynder')
              : []
          };

      } catch {
        showToast('API 暂不可用，已切换离线好友动态');

    if (!payload) {
      const sameNpcPool = OFFLINE_NPC_MOMENTS.filter(x => x.name === npc.name && !list.some(m => getPostText(m) === x.text));
      const anyUnused = OFFLINE_NPC_MOMENTS.filter(x => !list.some(m => getPostText(m) === x.text));
      const pickPool = sameNpcPool.length ? sameNpcPool : (anyUnused.length ? anyUnused : OFFLINE_NPC_MOMENTS);

        likers: [...picked.likers],

      };
    }

    const newMoment = buildCompatibleNpcMoment(list, npc, payload);
    list.unshift(newMoment);
    if (typeof _rawSaveST === 'function') _rawSaveST();
    else if (typeof saveST === 'function') saveST();

    }
    setTimeout(enhanceMomentsDOM, 30);
    showToast(`${npc.name} 刚刚发了一条新朋友圈 ✦`);
  };

            <div style="min-width:0;flex:1">
              <div style="font-size:12.5px;font-weight:700;color:#4a353d">${safeEsc(n.name)}</div>
              <div style="font-size:10px;color:#9e818c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${safeEsc(n.role)}</div>
            </div>
          </button>
        `).join('')}
      </div>
      <input id="mpCustomNpc" class="inp" placeholder="或者自己填一个好友名字（留空则用上面选中的）" />
      <input id="mpCustomTopic" class="inp" placeholder="想让TA发什么主题？（选填，留空自由发挥）" />
      <button id="mpDoNpcPost" type="button" class="btn pink">立即刷新 TA 的朋友圈 ✦</button>
    </div>`);

    const grid = document.getElementById('mpCastGrid');
    if (grid) {
      grid.querySelectorAll('[data-npc-pick]').forEach(btn => {
        btn.onclick = () => {
          playTap();
          selectedName = btn.dataset.npcPick;
          grid.querySelectorAll('[data-npc-pick]').forEach(b => b.classList.remove('on'));
          btn.classList.add('on');
          const cInp = document.getElementById('mpCustomNpc');
          if (cInp) cInp.value = '';
        };
      });
    }

    const goBtn = document.getElementById('mpDoNpcPost');
    if (goBtn) {
      goBtn.onclick = async () => {
        const customName = (document.getElementById('mpCustomNpc')?.value || '').trim();
        const customTopic = (document.getElementById('mpCustomTopic')?.value || '').trim();
        const chosen = customName ? getNpcMeta(customName) : getNpcMeta(selectedName);
        if (typeof closeModal === 'function') closeModal();
        showToast(`${chosen.name} 正在编辑朋友圈…`);
        await generateNpcMoment(chosen, customTopic);
      };
    }
  }

  // 5. 拦截 saveST：以后每发一条新朋友圈，立刻打上当前真实时间戳
  const _rawSaveST = window.saveST;
  if (typeof _rawSaveST === 'function') {
    window.saveST = function () {
      syncMomentTimes(false);
      return _rawSaveST.apply(this, arguments);
    };
  }

  // 6. 微信风个人朋友圈主页（支持 迟川 / 迟琰 / 任意好友相册 + 改时间 + 删除）
  function closeMomentProfile() {
    const old = document.getElementById('mpProfileOverlay');
    if (old) old.remove();
    const det = document.getElementById('mpDetailMask');
    if (det) det.remove();
  }

  function openSingleMomentDetail(m, who, ch) {
    const old = document.getElementById('mpDetailMask');
    if (old) old.remove();

    const isDad = who === 'dad';
    const isMe = who === 'me';
    const isNpc = String(who).startsWith('npc:');

    const npcMeta = isNpc ? getNpcMeta(npcName, m) : null;

    const dispName = isDad ? ch.name : (isMe ? (ST.userName || '迟琰') : npcMeta.name);
    const avSrc = isDad ? ch.avatar : (isMe ? ST.userAvatar : '');
    const tag = getPostTag(m);
    const img = getPostImg(m);
    const { names: likers, count: likeCount } = getLikesInfo(m);
    const cmts = getPostComments(m);
    const timeLabel = m.ts ? formatMomentTime(m.ts) : (m.time || '刚刚');
    const exactDate = m.ts ? (() => {
      const d = new Date(m.ts);
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    })() : '';

    const mask = document.createElement('div');
    mask.id = 'mpDetailMask';
    mask.className = 'mp-detail-mask';
    mask.innerHTML = `<div class="mp-detail-sheet">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="mp-quick-av" style="width:40px;height:40px;border-radius:11px;${npcMeta ? `background:${npcMeta.color}` : ''}">
            ${avSrc ? `<img src="${avSrc}" alt="">` : safeEsc(dispName.slice(0, 1))}
          </div>
          <div>
            <div style="font-size:15px;font-weight:700;color:#4a353d">${safeEsc(dispName)}</div>

          <button type="button" id="mpEditTimeBtn" style="font-size:11px;color:#c96283;background:rgba(229,140,168,0.14);padding:4px 9px;border-radius:999px">改时间</button>
          <button type="button" id="mpDelMomentBtn" style="font-size:11px;color:#a0858f;background:rgba(0,0,0,0.05);padding:4px 9px;border-radius:999px">删</button>
          <button type="button" id="mpDetClose" style="font-size:11.5px;color:#8f747e;background:rgba(0,0,0,0.06);padding:4px 10px;border-radius:999px">关闭</button>
        </div>
      </div>

      ${tag ? `<div style="margin-bottom:8px"><span class="mp-item-tag">${safeEsc(tag)}</span></div>` : ''}
      <div style="font-size:14.5px;line-height:1.72;white-space:pre-wrap;word-break:break-word;color:#4a353d">${safeEsc(getPostText(m))}</div>
      ${img ? `<img src="${img}" alt="" style="width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin-top:10px">` : ''}

      <div id="mpTimeEditor" style="display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid rgba(229,140,168,0.3)">

      ${(likeCount > 0 || cmts.length > 0) ? `<div class="mp-cmt-box">
        ${likeCount > 0 ? `<div style="color:#c96283;font-size:12px;${cmts.length ? 'padding-bottom:6px;border-bottom:1px solid rgba(229,140,168,0.18)' : ''}">♥ ${likers.length ? safeEsc(likers.join('、')) : `${likeCount} 人觉得很赞`}</div>` : ''}
        ${cmts.map(c => {
          const ca = c.a || c.author || c.name || c.by || c.u || '好友';
          const ct = c.t || c.text || c.content || c.msg || c.c || '';
          const rto = c.replyTo || c.to || '';
          const isCh = ca === ch.name || ca === '迟川' || ca === 'Cyrus';
          return `<div><strong style="color:${isCh ? '#c96283' : '#4a353d'}">${safeEsc(ca)}</strong>${rto ? ` <span style="color:#8f747e">回复</span> <strong>${safeEsc(rto)}</strong>` : ''}：${safeEsc(ct)}</div>`;
        }).join('')}
      </div>` : ''}
    </div>`;

    document.body.appendChild(mask);
    mask.onclick = e => { if (e.target === mask) { playTap(); mask.remove(); } };
    document.getElementById('mpDetClose').onclick = () => { playTap(); mask.remove(); };

    let delArmed = false;
    const delBtn = document.getElementById('mpDelMomentBtn');
    delBtn.onclick = () => {
      playTap();
      if (!delArmed) {
        delArmed = true;
        delBtn.textContent = '确认删?';
        delBtn.style.color = '#e05275';
        return;
      }
      const list = findMomentsList();
      if (list) {
        const idx = list.indexOf(m);
        if (idx > -1) {
          list.splice(idx, 1);
          if (typeof _rawSaveST === 'function') _rawSaveST();
          mask.remove();
          openMomentProfile(who);
          if (typeof window.renderCurrentApp === 'function') {
            try { window.renderCurrentApp(); } catch {}
          }
          showToast('已删除这条朋友圈');

      }

    document.getElementById('mpEditTimeBtn').onclick = () => {
      playTap();
      const box = document.getElementById('mpTimeEditor');
      const inp = document.getElementById('mpTimeInput');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
      const base = new Date(m.ts || Date.now());
      inp.value = `${base.getFullYear()}-${pad2(base.getMonth() + 1)}-${pad2(base.getDate())}T${pad2(base.getHours())}:${pad2(base.getMinutes())}`;
    };

    document.getElementById('mpTimeSave').onclick = () => {
      const val = document.getElementById('mpTimeInput').value;
      if (!val) return;
      const ts = new Date(val).getTime();
      if (!isNaN(ts)) {
        m.ts = ts;
        m.time = formatMomentTime(ts);
        if (typeof _rawSaveST === 'function') _rawSaveST();
        playTap();
        mask.remove();
        openMomentProfile(who);
        if (typeof window.renderCurrentApp === 'function') {
          try { window.renderCurrentApp(); } catch {}
        }
        showToast('已更新这条动态的真实时间 ✦');
      }
    };
  }

  window.openMomentProfile = function (who) {
    playTap();
    syncMomentTimes(true);
    closeMomentProfile();

    const ch = typeof activeChar === 'function' ? activeChar() : { name: '迟川', avatar: '' };
    const isDad = who === 'dad';
    const isMe = who === 'me';
    const isNpc = String(who).startsWith('npc:');
    const myName = (typeof ST !== 'undefined' && ST.userName) ? ST.userName : '迟琰';
    const list = findMomentsList() || [];

    const mine = list.filter(m => getAuthorType(m, ch) === who);
    const totalLikes = mine.reduce((sum, m) => sum + getLikesInfo(m).count, 0);

    const npcMeta = isNpc ? getNpcMeta(String(who).slice(4), mine[0]) : null;
    const dispName = isDad ? ch.name : (isMe ? myName : npcMeta.name);
    const otherName = isDad ? myName : ch.name;
    const otherWho = isDad ? 'me' : 'dad';
    const avSrc = isDad ? ch.avatar : (isMe && typeof ST !== 'undefined' ? ST.userAvatar : '');
    const bio = isDad
      ? (ch.bio || ch.motto || ch.signature || '新岚能源 · 只对你一人失控与偏爱')
      : isMe
        ? '记录和爸爸在一起的每一个心动日常 ✨'
        : `${npcMeta.role} · ${npcMeta.bio}`;

    // 按日期分组（微信相册同款）
    const groups = [];
    const groupMap = new Map();
    const nowD = new Date();
    const startOfDay = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();

    mine.forEach(m => {
      let key, dayWord = '', dayNum = '', monStr = '', yearStr = '';
      if (m.ts && typeof m.ts === 'number') {
        const d = new Date(m.ts);
        const dayDiff = Math.round((startOfDay(nowD) - startOfDay(d)) / 86400000);
        key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        if (dayDiff === 0) dayWord = '今天';
        else if (dayDiff === 1) dayWord = '昨天';
        else {
          dayNum = pad2(d.getDate());
          monStr = `${d.getMonth() + 1}月`;
          if (d.getFullYear() !== nowD.getFullYear()) yearStr = `${d.getFullYear()}年`;
        }
      } else {
        key = 'txt_' + (m.time || '回忆');
        dayWord = String(m.time || '回忆').slice(0, 4);
      }
      if (!groupMap.has(key)) {
        const g = { key, dayWord, dayNum, monStr, yearStr, items: [] };
        groupMap.set(key, g);
        groups.push(g);
      }
      groupMap.get(key).items.push(m);
    });

    const overlay = document.createElement('div');
    overlay.id = 'mpProfileOverlay';
    overlay.className = 'mp-overlay';
    overlay.innerHTML = `<div class="mp-shell">
      <div class="mp-scroll no-sb">
        <div class="mp-cover ${isDad ? 'dad' : 'me'}" ${npcMeta ? `style="background:${npcMeta.color}"` : ''}>
          <div class="mp-topbar">
            <button type="button" id="mpCloseBtn" class="mp-topbtn">← 返回</button>
            <button type="button" id="mpSwitchBtn" class="mp-topbtn">看 ${safeEsc(otherName)} 的相册 ⇄</button>
          </div>
          <div class="mp-profile-anchor">
            <div class="mp-name-wrap">
              <div class="mp-name">${safeEsc(dispName)}${isDad ? ' <span style="font-size:12px;color:#f7dec0">✦</span>' : isMe ? ' <span style="font-size:12px;color:#fff0f6">♥</span>' : ''}</div>
            </div>
            <div class="mp-big-av" ${npcMeta ? `style="background:${npcMeta.color}"` : ''}>
              ${avSrc ? `<img src="${avSrc}" alt="">` : safeEsc(dispName.slice(0, 1))}
            </div>
          </div>
        </div>

        <div class="mp-bio-sec">
          <div class="mp-bio-txt">${safeEsc(bio)}</div>
          <div class="mp-stats">
            <span class="mp-stat-chip">共 ${mine.length} 条朋友圈</span>
            <span class="mp-stat-chip">累计获赞 ${totalLikes}</span>
          </div>
        </div>

        <div class="mp-album">
          ${groups.length ? groups.map(g => `
            <div class="mp-day-row">
              <div class="mp-day-col">
                ${g.dayWord
                  ? `<div class="mp-day-word">${safeEsc(g.dayWord)}</div>`
                  : `<div><span class="mp-day-big">${safeEsc(g.dayNum)}</span><span class="mp-day-mon">${safeEsc(g.monStr)}</span></div>`}
                ${g.yearStr ? `<div class="mp-day-year">${safeEsc(g.yearStr)}</div>` : ''}
              </div>
              <div class="mp-cards-col">
                ${g.items.map(m => {
                  const idxInMine = mine.indexOf(m);
                  const tag = getPostTag(m);
                  const img = getPostImg(m);
                  const cmts = getPostComments(m);
                  const likes = getLikesInfo(m).count;
                  const hm = m.ts ? `${pad2(new Date(m.ts).getHours())}:${pad2(new Date(m.ts).getMinutes())}` : (m.time || '');
                  return `<div class="mp-item" data-mp-idx="${idxInMine}">
                    <div class="mp-item-top">
                      <span class="mp-item-time">${safeEsc(hm)}</span>
                      ${tag ? `<span class="mp-item-tag">${safeEsc(tag)}</span>` : ''}
                    </div>
                    <div class="mp-item-body">
                      ${img ? `<img class="mp-item-thumb" src="${img}" alt="">` : ''}
                      <div class="mp-item-text">${safeEsc(getPostText(m))}</div>
                    </div>
                    <div class="mp-item-ft">
                      <span>♥ ${likes} · 💬 ${cmts.length}</span>
                      <span style="color:#c96283">查看详情 ›</span>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          `).join('') : `<div class="mp-empty">${safeEsc(dispName)} 还没有发过朋友圈哦～</div>`}
        </div>
      </div>
    </div>`;

    document.body.appendChild(overlay);
    document.getElementById('mpCloseBtn').onclick = () => { playTap(); closeMomentProfile(); };
    document.getElementById('mpSwitchBtn').onclick = () => openMomentProfile(otherWho);
    overlay.querySelectorAll('[data-mp-idx]').forEach(el => {
      el.onclick = () => {
        playTap();
        const item = mine[Number(el.dataset.mpIdx)];
        if (item) openSingleMomentDetail(item, who, ch);
      };
    });
  };

  // 7. 增强朋友圈页面：顶部主页入口 + 好友发动态按键 + 修正 NPC 头像/名字 + 真实时间 + 点击头像进主页
  function isMomentsViewActive() {
    const layer = document.getElementById('appLayer');
    if (!layer || !layer.innerHTML) return false;
    if (typeof RT !== 'undefined' && ['moments', 'pyq', 'circle', 'feed'].includes(RT.app)) return true;
    const head = layer.querySelector('.app-hd, header, [class*="hd"]');
    return !!(head && head.textContent && head.textContent.includes('朋友圈'));
  }

  function enhanceMomentsDOM() {
    if (!isMomentsViewActive()) return;
    const layer = document.getElementById('appLayer');
    const body = layer.querySelector('.app-body') || layer;
    const list = findMomentsList();
    if (!list || !body) return;

    const ch = typeof activeChar === 'function' ? activeChar() : { name: '迟川', avatar: '' };
    const myName = (typeof ST !== 'undefined' && ST.userName) ? ST.userName : '迟琰';
    const dadCount = list.filter(m => getAuthorType(m, ch) === 'dad').length;
    const meCount = list.filter(m => getAuthorType(m, ch) === 'me').length;

    if (!document.getElementById('mpTopPanel')) {
      const panel = document.createElement('div');
      panel.id = 'mpTopPanel';
      panel.className = 'mp-top-panel';
      panel.innerHTML = `
        <div class="mp-quick-bar">
          <button type="button" id="mpOpenDad" class="mp-quick-pill">
            <div class="mp-quick-av">${ch.avatar ? `<img src="${ch.avatar}" alt="">` : safeEsc(ch.name.slice(0, 1))}</div>
            <div style="min-width:0;flex:1">
              <div style="font-size:13px;font-weight:700;color:#4a353d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${safeEsc(ch.name)}的主页</div>
              <div style="font-size:10.5px;color:#9e818c">${dadCount} 条朋友圈 ›</div>
            </div>
          </button>
          <button type="button" id="mpOpenMe" class="mp-quick-pill">
            <div class="mp-quick-av">${ST.userAvatar ? `<img src="${ST.userAvatar}" alt="">` : safeEsc(myName.slice(0, 1))}</div>
            <div style="min-width:0;flex:1">
              <div style="font-size:13px;font-weight:700;color:#4a353d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${safeEsc(myName)}的主页</div>
              <div style="font-size:10.5px;color:#9e818c">${meCount} 条朋友圈 ›</div>
            </div>
          </button>
        </div>
        <div class="mp-npc-bar">
          <button type="button" id="mpGenNpcRand" class="mp-npc-btn primary">✨ 刷新 1 条好友动态</button>
          <button type="button" id="mpGenNpcPick" class="mp-npc-btn secondary">👥 指定好友发</button>
        </div>`;
      body.insertBefore(panel, body.firstChild);

      document.getElementById('mpOpenDad').onclick = () => openMomentProfile('dad');
      document.getElementById('mpOpenMe').onclick = () => openMomentProfile('me');
      document.getElementById('mpGenNpcPick').onclick = () => openNpcPickerModal();
      document.getElementById('mpGenNpcRand').onclick = async () => {
        const b1 = document.getElementById('mpGenNpcRand');
        const b2 = document.getElementById('mpGenNpcPick');
        if (b1) { b1.disabled = true; b1.textContent = '好友正在编辑中…'; }
        if (b2) b2.disabled = true;
        try {
          await generateNpcMoment(null, '');
        } finally {
          const nb1 = document.getElementById('mpGenNpcRand');
          const nb2 = document.getElementById('mpGenNpcPick');
          if (nb1) { nb1.disabled = false; nb1.textContent = '✨ 刷新 1 条好友动态'; }
          if (nb2) nb2.disabled = false;
        }
      };
    }

    const cards = Array.from(body.querySelectorAll('.card')).filter(c => !c.closest('#mpTopPanel'));
    cards.forEach((card, idx) => {
      let m = list[idx];
      const txt = card.textContent || '';
      if (!m || (getPostText(m).length > 6 && !txt.includes(getPostText(m).slice(0, 10)))) {
        const found = list.find(x => getPostText(x).length > 6 && txt.includes(getPostText(x).slice(0, 10)));
        if (found) m = found;
      }
      if (!m) return;

      const who = getAuthorType(m, ch);
      const isNpcPost = String(who).startsWith('npc:');

      // 兜底把界面上还残留的“刚刚”换成真实时间
      if (m.ts) {
        const realTime = formatMomentTime(m.ts);
        if (realTime !== '刚刚') {
          card.querySelectorAll('div, span').forEach(node => {
            if (node.children.length === 0 && node.textContent && node.textContent.trim().startsWith('刚刚')) {
              node.textContent = node.textContent.replace(/^(\s*)刚刚/, `$1${realTime}`);
            }
          });
        }
      }

      if (card.dataset.mpBound) return;
      card.dataset.mpBound = '1';

      const head = card.firstElementChild || card;

      // 如果是共同好友发的动态，确保显示 TA 自己的彩色头像与名字（避免被原代码误显示成迟川）
      if (isNpcPost) {
        const npcMeta = getNpcMeta(getPostAuthor(m), m);
        const topImg = head.querySelector('img');
        let npcAvEl = null;
        if (topImg) {
          const badge = document.createElement('div');
          badge.className = 'mp-npc-av mp-clickable-av';
          badge.style.background = npcMeta.color;
          badge.textContent = npcMeta.av;
          badge.title = `点击查看 ${npcMeta.name} 的朋友圈`;
          const wrap = topImg.parentElement;
          if (wrap && wrap !== head && wrap.children.length === 1) {
            wrap.replaceWith(badge);
          } else {
            topImg.replaceWith(badge);
          }
          npcAvEl = badge;
        }
        const headNodes = Array.from(head.querySelectorAll('div, span, strong')).slice(0, 10);
        headNodes.forEach(el => {
          if (el.children.length === 0 && !el.closest('button')) {
            const t = el.textContent.trim();
            if (t === ch.name || t === '迟川' || t === npcMeta.name) {
              el.textContent = npcMeta.name;
              el.style.cursor = 'pointer';
              el.addEventListener('click', e => {
                e.stopPropagation();
                openMomentProfile(who);
              });
            }
          }
        });
        if (npcAvEl) {
          npcAvEl.addEventListener('click', e => {
            e.stopPropagation();
            openMomentProfile(who);
          });
        }
        return;
      }

      if (who !== 'dad' && who !== 'me') return;

      const topImg = head.querySelector('img') || card.querySelector('img');
      const avTarget = topImg ? (topImg.parentElement || topImg) : head.firstElementChild;
      if (avTarget && !avTarget.closest('button')) {
        avTarget.classList.add('mp-clickable-av');
        avTarget.title = '点击查看个人朋友圈主页';
        avTarget.addEventListener('click', e => {
          e.stopPropagation();
          openMomentProfile(who);
        });
      }

      const targetName = who === 'dad' ? ch.name : myName;
      const nameNodes = Array.from(head.querySelectorAll('div, span, strong')).slice(0, 10);
      const nameEl = nameNodes.find(el => el.children.length === 0 && el.textContent.trim() === targetName);
      if (nameEl && !nameEl.closest('button')) {
        nameEl.style.cursor = 'pointer';
        nameEl.addEventListener('click', e => {
          e.stopPropagation();
          openMomentProfile(who);
        });
      }
    });
  }

  // 8. 聊天页面点击你和迟川的消息头像，也能直接跳进个人朋友圈主页
  if (!window._mpGlobalAvatarBind) {
    window._mpGlobalAvatarBind = true;
    document.addEventListener('click', e => {
      const layer = document.getElementById('appLayer');
      if (!layer || !layer.contains(e.target)) return;
      if (e.target.closest('#mpProfileOverlay, #mpDetailMask, #mpTopPanel, #modal, .modal, button, a, input, textarea, label, select, [onclick]')) return;

      const appName = (typeof RT !== 'undefined' && RT.app) ? RT.app : '';
      if (appName !== 'chat' && !isMomentsViewActive()) return;

      const img = e.target.tagName === 'IMG' ? e.target : e.target.querySelector?.('img');
      if (!img || !img.src) return;

      const ch = typeof activeChar === 'function' ? activeChar() : null;
      const isDadAv = ch && ch.avatar && img.src === ch.avatar;
      const isMeAv = typeof ST !== 'undefined' && ST.userAvatar && img.src === ST.userAvatar;
      if (!isDadAv && !isMeAv) return;

      const rect = img.getBoundingClientRect();
      if (rect.width > 66 || rect.height > 66) return;

      e.stopPropagation();
      openMomentProfile(isDadAv ? 'dad' : 'me');
    }, false);
  }

  // 9. 挂钩渲染函数 + DOM 监听 + 每分钟自动刷新时间
  ['vMoments', 'vPyq', 'vFeed', 'vCircle', 'renderCurrentApp'].forEach(fnName => {
    const orig = window[fnName];
    if (typeof orig === 'function' && !orig._mpWrapped) {
      const wrapped = function () {
        syncMomentTimes(false);
        const res = orig.apply(this, arguments);
        setTimeout(enhanceMomentsDOM, 0);
        return res;
      };
      wrapped._mpWrapped = true;
      window[fnName] = wrapped;
    }
  });

  const layerEl = document.getElementById('appLayer');
  if (layerEl && typeof MutationObserver !== 'undefined') {
    let obsTimer = null;
    const obs = new MutationObserver(() => {
      if (!isMomentsViewActive()) return;
      clearTimeout(obsTimer);
      obsTimer = setTimeout(() => {
        syncMomentTimes(false);
        enhanceMomentsDOM();
      }, 40);
    });
    obs.observe(layerEl, { childList: true, subtree: false });
  }

  syncMomentTimes(true);
  setTimeout(enhanceMomentsDOM, 200);
  setInterval(() => {
    const changed = syncMomentTimes(false);
    if (changed && isMomentsViewActive()) enhanceMomentsDOM();
  }, 60000);
})();

  // 2. 自动压缩图片 / 表情包（保护 iPhone 浏览器存储空间，同时支持动图 GIF）
  function compressImageFile(file, opts = {}) {
    const maxSide = opts.maxSide || 480;
    const quality = opts.quality || 0.72;
    const keepGif = !!opts.keepGif;
    const keepAlpha = !!opts.keepAlpha;

    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('读取图片失败'));
      reader.onload = () => {
        const rawUrl = reader.result;
        if (keepGif && file.type === 'image/gif' && file.size < 340 * 1024) {
          return resolve(rawUrl);
        }
        const img = new Image();
        img.onerror = () => reject(new Error('图片格式暂不支持'));
        img.onload = () => {
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if (w > maxSide || h > maxSide) {
            if (w >= h) { h = Math.round((h * maxSide) / w); w = maxSide; }
            else { w = Math.round((w * maxSide) / h); h = maxSide; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, w);
          canvas.height = Math.max(1, h);
          const ctx = canvas.getContext('2d');
          if (!keepAlpha) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          let out = '';
          if (keepAlpha) {
            out = canvas.toDataURL('image/webp', quality);
            if (!out.startsWith('data:image/webp')) {
              out = canvas.toDataURL('image/png');
            }
          } else {
            out = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(out);
        };
        img.src = rawUrl;
      };
      reader.readAsDataURL(file);
    });
  }

  // 3. 拦截发往 Gemini / OpenAI 的 API 请求：让迟川真正看懂图片与表情包！
  if (!window._wcFetchPatched && typeof window.fetch === 'function') {
    window._wcFetchPatched = true;
    const _origFetch = window.fetch.bind(window);

    function lookupMedia(id) {
      if (!ensureMediaStore()) return null;
      return ST.chatMedia[id] || null;
    }
    function lookupCustomSticker(id) {
      if (!ensureMediaStore()) return null;
      return ST.customStickers.find(x => x.id === id) || null;
    }
    function parseDataUrlForVision(dataUrl) {
      if (!dataUrl || typeof dataUrl !== 'string') return null;
      const m = dataUrl.match(/^data:(image\/(?:jpeg|jpg|png|webp));base64,(.+)$/i);
      if (!m) return null;
      const mime = m[1].toLowerCase() === 'image/jpg' ? 'image/jpeg' : m[1].toLowerCase();
      return { mime, base64: m[2], url: dataUrl };
    }

    function cleanTextAndCollectVision(text, collected) {
      if (typeof text !== 'string' || !TOKEN_TEST_RE.test(text)) return text;
      const recentId = (typeof RT !== 'undefined' && RT._wcLastMediaId && (Date.now() - (RT._wcLastMediaAt || 0) < 35000))
        ? RT._wcLastMediaId : '';
      return text.replace(TOKEN_RE, (_, kind, payload) => {
        if (kind === 'MEDIA') {
          const id = payload.trim();
          const m = lookupMedia(id);
          if (m && m.data && (!recentId || recentId === id)) {
            const v = parseDataUrlForVision(m.data);
            if (v) collected.push(v);
          }
          return m && m.note ? `（发来了一张照片，附言：${m.note}）` : '（发来了一张照片，请结合照片画面自然回应）';
        }
        const parts = payload.split('|');
        const sid = (parts[0] || '').trim();
        const label = parts.slice(1).join('|').trim();
        if (sid.startsWith('cs_')) {
          const cs = lookupCustomSticker(sid);
          if (cs && cs.data && recentId === sid) {
            const v = parseDataUrlForVision(cs.data);
            if (v) collected.push(v);
          }
          const desc = label || (cs && cs.label) || '可爱表情包';
          return `（发来一个表情包：${desc}）`;
        }
        const bi = BUILTIN_STICKERS.find(x => x.id === sid);
        return `（发来一个表情包：${label || (bi ? bi.label : '可爱贴纸')}）`;
      });
    }

    window.fetch = async function (input, init) {
      if (!init || typeof init.body !== 'string' || !TOKEN_TEST_RE.test(init.body)) {
        return _origFetch(input, init);
      }

      let parsed;
      try { parsed = JSON.parse(init.body); } catch { return _origFetch(input, init); }

      const textOnlyBody = JSON.parse(init.body);
      let attachedVision = false;

      // Gemini generateContent 格式
      if (Array.isArray(parsed.contents)) {
        const cleanParts = (arr, collectArr) => {
          arr.forEach(p => {
            if (p && typeof p.text === 'string') {
              p.text = cleanTextAndCollectVision(p.text, collectArr);
            }
          });
        };
        if (parsed.systemInstruction?.parts) cleanParts(parsed.systemInstruction.parts, []);
        if (textOnlyBody.systemInstruction?.parts) cleanParts(textOnlyBody.systemInstruction.parts, []);

        parsed.contents.forEach((c, idx) => {
          if (!c || !Array.isArray(c.parts)) return;
          const foundImgs = [];
          cleanParts(c.parts, foundImgs);
          if (textOnlyBody.contents[idx]?.parts) cleanParts(textOnlyBody.contents[idx].parts, []);
          if (foundImgs.length) {
            const latest = foundImgs[foundImgs.length - 1];
            c.parts.push({ inlineData: { mimeType: latest.mime, data: latest.base64 } });
            attachedVision = true;
          }
        });
      }
      // OpenAI / 中转站 chat/completions 格式
      else if (Array.isArray(parsed.messages)) {
        parsed.messages.forEach((msg, idx) => {
          if (!msg || typeof msg.content !== 'string') return;
          const foundImgs = [];
          const cleaned = cleanTextAndCollectVision(msg.content, foundImgs);
          textOnlyBody.messages[idx].content = cleaned;
          if (foundImgs.length && msg.role === 'user') {
            const latest = foundImgs[foundImgs.length - 1];
            msg.content = [
              { type: 'text', text: cleaned },
              { type: 'image_url', image_url: { url: latest.url } }
            ];
            attachedVision = true;
          } else {
            msg.content = cleaned;
          }
        });
      } else {
        return _origFetch(input, init);
      }

      const res = await _origFetch(input, { ...init, body: JSON.stringify(parsed) });
      // 如果所选第三方中转模型不支持识图返回 400/415/422，自动无感降级成纯文字描述重试，绝不报错
      if (attachedVision && !res.ok && [400, 415, 422].includes(res.status)) {
        return _origFetch(input, { ...init, body: JSON.stringify(textOnlyBody) });
      }
      return res;
    };
  }

  // 5. 定位聊天输入栏并发送消息
  function isChatViewActive() {
    const layer = document.getElementById('appLayer');
    if (!layer || !layer.innerHTML) return false;
    if (typeof RT !== 'undefined' && RT.app === 'chat') return true;
    return false;
  }

  function findChatContext() {
    const layer = document.getElementById('appLayer');
    if (!layer) return null;
    const forms = Array.from(layer.querySelectorAll('form')).filter(f => !f.closest('#modal, .modal, .wc-mask'));
    let form = forms[forms.length - 1] || null;
    let inp = form ? form.querySelector('input:not([type="file"]):not([type="hidden"]):not([type="checkbox"]), textarea') : null;
    if (!inp) {
      const inputs = Array.from(layer.querySelectorAll('input:not([type="file"]):not([type="hidden"]):not([type="checkbox"]), textarea'))
        .filter(el => !el.closest('#modal, .modal, .wc-mask'));
      inp = inputs[inputs.length - 1] || null;
      if (inp) form = inp.closest('form') || inp.parentElement;
    }
    if (!inp || !form) return null;

    const btns = Array.from(form.querySelectorAll('button')).filter(b => !b.classList.contains('wc-tool-btn'));
    const sendBtn = btns.find(b => b.type === 'submit') || btns[btns.length - 1] || null;
    let bar = form;
    if (bar.parentElement && bar.parentElement !== layer) {
      const pStyle = getComputedStyle(bar.parentElement);
      if (pStyle.flexDirection !== 'column' && bar.parentElement.parentElement && bar.parentElement.parentElement !== layer) {
        bar = bar.parentElement;
      }
    }
    const scroller = layer.querySelector('.chat-body, .chat-msgs, .app-body, .no-sb');
    return { layer, form, bar, inp, sendBtn, scroller };
  }

  function submitChatToken(tokenText) {
    const ctx = findChatContext();
    if (!ctx) return showToast('请先打开聊天界面哦');
    const { form, inp, sendBtn } = ctx;
    inp.value = tokenText;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    if (sendBtn) {
      sendBtn.click();
    } else if (form.tagName === 'FORM' && form.requestSubmit) {
      form.requestSubmit();
    } else {
      form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
    }
  }

  function insertEmojiToInput(emoji) {
    const ctx = findChatContext();
    if (!ctx) return;
    const { inp } = ctx;
    const start = inp.selectionStart ?? inp.value.length;
    const end = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, start) + emoji + inp.value.slice(end);
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    try { inp.setSelectionRange(start + emoji.length, start + emoji.length); } catch {}
  }

  // 6. 隐藏文件选择器（相册发图 / 拍照 / 添加表情包）
  function ensurePickers() {
    if (document.getElementById('wcPhotoPicker')) return;
    const wrap = document.createElement('div');
    wrap.style.display = 'none';
    wrap.innerHTML = `
      <input id="wcPhotoPicker" type="file" accept="image/*" />
      <input id="wcCameraPicker" type="file" accept="image/*" capture="environment" />
      <input id="wcStickerPicker" type="file" accept="image/*" />
    `;
    document.body.appendChild(wrap);

    const handlePhoto = async e => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        showToast('正在处理图片…');
        const url = await compressImageFile(file, { maxSide: 480, quality: 0.72, keepAlpha: false });
        openPhotoConfirmModal(url);
      } catch (err) {
        showToast(err.message || '图片处理失败');
      }
    };
    document.getElementById('wcPhotoPicker').onchange = handlePhoto;
    document.getElementById('wcCameraPicker').onchange = handlePhoto;

    document.getElementById('wcStickerPicker').onchange = async e => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        showToast('正在整理表情包…');
        const url = await compressImageFile(file, { maxSide: 220, quality: 0.8, keepGif: true, keepAlpha: true });
        openAddStickerModal(url);
      } catch (err) {
        showToast(err.message || '表情包读取失败');
      }
    };
  }

      drawer.querySelectorAll('[data-ins-em]').forEach(b => {
        b.onclick = () => { playTap(); insertEmojiToInput(b.dataset.insEm); };
      });
    }

    if (ctx.scroller) {
      setTimeout(() => { ctx.scroller.scrollTop = ctx.scroller.scrollHeight; }, 30);
    }
  }

  // 8. 把聊天记录里的 [[MEDIA:...]] 和 [[STICKER:...]] 渲染成微信同款图片/贴纸气泡
  function renderMediaBubbles(root) {
    if (!root) return;
    ensureMediaStore();
    const isChat = isChatViewActive();

    const nodes = Array.from(root.querySelectorAll('div, p, span'));
    nodes.forEach(el => {
      if (el.dataset.wcMediaDone || el.closest('#wcDrawer, .wc-mask, input, textarea')) return;
      const raw = el.textContent || '';
      if (!TOKEN_TEST_RE.test(raw)) return;
      // 只处理最内层包含标记的节点，避免覆盖整条消息外壳
      const hasChildToken = Array.from(el.children).some(ch => TOKEN_TEST_RE.test(ch.textContent || ''));
      if (hasChildToken) return;

      el.dataset.wcMediaDone = '1';

      // 在非聊天页（如桌面预览/消息列表）里，优雅替换成 [图片] / [表情包]
      if (!isChat) {
        el.textContent = raw.replace(TOKEN_RE, (_, kind) => (kind === 'MEDIA' ? '[图片]' : '[表情包]'));
        return;
      }

      const restText = raw.replace(TOKEN_RE, '').trim();
      const matches = [...raw.matchAll(TOKEN_RE)];
      if (!matches.length) return;
      const [, kind, payload] = matches[0];

      if (kind === 'STICKER') {
        const parts = payload.split('|');
        const sid = (parts[0] || '').trim();
        const label = parts.slice(1).join('|').trim();
        let visualHTML = '';

        if (sid.startsWith('cs_')) {
          const cs = (ST.customStickers || []).find(x => x.id === sid);
          visualHTML = cs
            ? `<img class="wc-msg-sticker" src="${cs.data}" alt="${safeEsc(label || cs.label)}" data-wc-zoom="${cs.data}">`
            : `<span style="font-size:12px;color:#9e818c">[表情包：${safeEsc(label || '已删除')}]</span>`;
        } else {
          const bi = BUILTIN_STICKERS.find(x => x.id === sid);
          visualHTML = bi
            ? `<div class="wc-msg-sticker">${bi.svg}</div>`
            : `<span style="font-size:12px;color:#9e818c">[表情包：${safeEsc(label)}]</span>`;
        }

        el.innerHTML = restText
          ? `${visualHTML}<div class="wc-msg-cap" style="margin-top:4px">${safeEsc(restText)}</div>`
          : visualHTML;

        if (!restText) {
          el.classList.add('wc-bare-bub');
          if (el.parentElement && el.parentElement.children.length === 1 && /bub|bubble|msg-b/i.test(el.parentElement.className || '')) {
            el.parentElement.classList.add('wc-bare-bub');
          }
        }
      } else if (kind === 'MEDIA') {
        const id = payload.trim();
        const item = ST.chatMedia && ST.chatMedia[id];
        if (item && item.data) {
          el.innerHTML = `<div class="wc-msg-photo-wrap">
            <img class="wc-msg-photo" src="${item.data}" alt="聊天图片" data-wc-zoom="${item.data}">
            ${restText ? `<div class="wc-msg-cap">${safeEsc(restText)}</div>` : ''}
          </div>`;
          if (!restText) {
            el.classList.add('wc-bare-bub');
            if (el.parentElement && el.parentElement.children.length === 1 && /bub|bubble|msg-b/i.test(el.parentElement.className || '')) {
              el.parentElement.classList.add('wc-bare-bub');
            }
          }
        } else {
          el.innerHTML = `<span style="font-size:12px;opacity:0.75">[图片已清理${restText ? ' · ' + safeEsc(restText) : ''}]</span>`;
        }
      }

      el.querySelectorAll('[data-wc-zoom]').forEach(imgEl => {
        imgEl.onclick = e => {
          e.stopPropagation();
          openLightbox(imgEl.dataset.wcZoom);
        };
      });
    });
  }

  // 9. 注入聊天页底部 ☺ 和 ⊕ 按钮
  function enhanceChatUI() {
    const layer = document.getElementById('appLayer');
    renderMediaBubbles(layer || document.body);
    renderMediaBubbles(document.getElementById('homeLayer') || document.querySelector('.home-wrap'));

    if (!isChatViewActive()) return;
    const ctx = findChatContext();
    if (!ctx) return;

    ensurePickers();
    const { form, inp, sendBtn } = ctx;

    if (!document.getElementById('wcBtnEmoji')) {
      const btnEmo = document.createElement('button');
      btnEmo.id = 'wcBtnEmoji';
      btnEmo.type = 'button';
      btnEmo.className = 'wc-tool-btn';
      btnEmo.title = '表情包';
      btnEmo.textContent = '☺';
      btnEmo.onclick = () => {
        playTap();
        RT._wcDrawer = RT._wcDrawer === 'sticker' ? null : 'sticker';
        renderDrawer();
      };

      const btnPlus = document.createElement('button');
      btnPlus.id = 'wcBtnPlus';
      btnPlus.type = 'button';
      btnPlus.className = 'wc-tool-btn';
      btnPlus.title = '发送图片 / 更多';
      btnPlus.textContent = '＋';
      btnPlus.onclick = () => {
        playTap();
        RT._wcDrawer = RT._wcDrawer === 'plus' ? null : 'plus';
        renderDrawer();
      };

      if (sendBtn && sendBtn.parentNode === form) {
        form.insertBefore(btnEmo, sendBtn);
        form.insertBefore(btnPlus, sendBtn);
      } else {
        form.appendChild(btnEmo);
        form.appendChild(btnPlus);
      }

      inp.addEventListener('focus', () => {
        if (typeof RT !== 'undefined' && RT._wcDrawer) {
          RT._wcDrawer = null;
          renderDrawer();
        }
      });
    }

    if (typeof RT !== 'undefined' && RT._wcDrawer && !document.getElementById('wcDrawer')) {
      renderDrawer();
    }
  }

  // 10. 挂钩渲染函数与 DOM 监听，确保每次刷新聊天页都丝滑保留
  ['vChat', 'renderCurrentApp', 'renderHomeWidgets'].forEach(fnName => {
    const orig = window[fnName];
    if (typeof orig === 'function' && !orig._wcWrapped) {
      const wrapped = function () {
        const res = orig.apply(this, arguments);
        setTimeout(enhanceChatUI, 0);
        return res;
      };
      wrapped._wcWrapped = true;
      window[fnName] = wrapped;
    }
  });

  const layerEl = document.getElementById('appLayer');
  if (layerEl && typeof MutationObserver !== 'undefined') {
    let t = null;
    const obs = new MutationObserver(() => {
      clearTimeout(t);
      t = setTimeout(enhanceChatUI, 30);
    });
    obs.observe(layerEl, { childList: true, subtree: true });
  }

  setTimeout(enhanceChatUI, 180);
})();
</script>

  // 2. 数据与消息辅助工具
  function ensureDadVault() {
    if (typeof ST === 'undefined' || !ST) return false;
    if (!Array.isArray(ST.dadStickerVault)) ST.dadStickerVault = [];
    if (!ST.cfg) ST.cfg = {};
    if (!ST.cfg.dadStkFreq) ST.cfg.dadStkFreq = 'normal'; // off | rare | normal | often
    return true;
  }

  function findChatMsgs(ch) {
    if (!ch && typeof activeChar === 'function') ch = activeChar();
    if (!ch) return null;
    for (const k of ['msgs', 'messages', 'chat', 'history', 'logs']) {
      if (Array.isArray(ch[k])) return ch[k];
    }
    if (typeof ST !== 'undefined' && ST) {
      for (const k of ['chats', 'msgs', 'messages', 'chatHistory']) {
        if (ST[k] && Array.isArray(ST[k][ch.id])) return ST[k][ch.id];
      }
      for (const k of ['msgs', 'messages', 'chat']) {
        if (Array.isArray(ST[k])) return ST[k];
      }
    }
    return null;
  }

  function getMsgTextKey(m) {
    if (!m || typeof m !== 'object') return 'text';
    if ('t' in m) return 't';
    if ('text' in m) return 'text';
    if ('content' in m) return 'content';
    if ('msg' in m) return 'msg';
    return 'text';
  }
  function getMsgText(m) { return String((m && m[getMsgTextKey(m)]) || ''); }
  function isUserMsg(m) {
    if (!m || typeof m !== 'object') return false;
    if (m.isMe === true || m.me === true) return true;
    const r = String(m.from || m.role || m.sender || m.who || m.by || '').toLowerCase();
    return ['me', 'user', 'self', 'my', 'u'].includes(r);
  }
  function isCharMsg(m) {
    if (!m || typeof m !== 'object') return false;
    if (m.isMe === false || m.me === false) return true;
    const r = String(m.from || m.role || m.sender || m.who || m.by || '').toLowerCase();
    return ['him', 'char', 'assistant', 'ai', 'bot', 'dad', 'c', 'ch', 'other'].includes(r);
  }
  function makeMsgFingerprint(m, idx) {
    return `${idx}:${m.id || ''}:${isUserMsg(m) ? 'u' : 'c'}:${getMsgText(m).slice(0, 28)}`;
  }

  // 把有效可发送的偷存表情过滤出来（确保用户删掉的自定义图不会裂图）
  function getUsableVault() {
    if (!ensureDadVault()) return [];
    const customIds = new Set((ST.customStickers || []).map(x => x.id));
    return ST.dadStickerVault.filter(v => !v.sid.startsWith('cs_') || customIds.has(v.sid));
  }

  // 3. 悄悄收藏你发的表情包
  function stealStickersFromText(text) {
    if (!text || !ensureDadVault()) return false;
    const matches = [...String(text).matchAll(USER_STK_RE)];
    if (!matches.length) return false;
    let addedNew = false;
    matches.forEach(m => {
      const parts = m[1].split('|');
      const sid = (parts[0] || '').trim();
      const label = parts.slice(1).join('|').trim() || '可爱表情包';
      if (!sid) return;
      const exist = ST.dadStickerVault.find(x => x.sid === sid);
      if (exist) {
        exist.seenCount = (exist.seenCount || 1) + 1;
        exist.lastSeenAt = Date.now();
        if (label && label !== '可爱表情包') exist.label = label;
      } else {
        ST.dadStickerVault.unshift({
          sid,
          label,
          stolenAt: Date.now(),
          seenCount: 1,
          usedCount: 0
        });
        if (ST.dadStickerVault.length > 28) ST.dadStickerVault.length = 28;
        addedNew = true;
      }
    });
    return addedNew;
  }

  // 4. 把 AI 输出的 <<STK:id>> 转为真实表情包标记
  function resolveAiStickerId(id) {
    const cleanId = String(id || '').trim();
    const dad = DAD_STICKERS.find(x => x.id === cleanId);
    if (dad) return `[[DADSTK:${dad.id}|${dad.label}]]`;
    const vault = getUsableVault();
    const stolen = vault.find(x => x.sid === cleanId);
    if (stolen) {
      stolen.usedCount = (stolen.usedCount || 0) + 1;
      return `[[STICKER:${stolen.sid}|${stolen.label}]]`;
    }
    const cs = (ST.customStickers || []).find(x => x.id === cleanId);
    if (cs) return `[[STICKER:${cs.id}|${cs.label || '表情包'}]]`;
    if (cleanId.startsWith('bi_')) return `[[STICKER:${cleanId}|可爱贴纸]]`;
    return '';
  }

  function convertAiStickerTokens(str) {
    if (typeof str !== 'string' || !str.includes('<<STK:')) return str;
    return str.replace(AI_STK_RE, (_, id) => resolveAiStickerId(id)).trim();
  }

  function deepConvertObjectTokens(obj) {
    if (typeof obj === 'string') return convertAiStickerTokens(obj);
    if (Array.isArray(obj)) return obj.map(deepConvertObjectTokens);
    if (obj && typeof obj === 'object') {
      Object.keys(obj).forEach(k => { obj[k] = deepConvertObjectTokens(obj[k]); });
    }
    return obj;
  }

  // 5. 为迟川挑选一枚贴合当下语境的表情包（优先混用他偷偷存的你的表情包 + 他的黑金贴纸）
  function pickStickerForDad(replyText, preferStolen = null) {
    const vault = getUsableVault();
    const useStolen = preferStolen !== null
      ? (preferStolen && vault.length > 0)
      : (vault.length > 0 && Math.random() < 0.62);

    if (useStolen) {
      // 优先挑用得少或用户刚收藏的自定义图，避免总发同一个
      const sorted = [...vault].sort((a, b) => {
        const aScore = (a.usedCount || 0) - (a.sid.startsWith('cs_') ? 0.5 : 0);
        const bScore = (b.usedCount || 0) - (b.sid.startsWith('cs_') ? 0.5 : 0);
        return aScore - bScore;
      });
      const pool = sorted.slice(0, Math.min(4, sorted.length));
      const pick = pool[Math.floor(Math.random() * pool.length)];
      pick.usedCount = (pick.usedCount || 0) + 1;
      return `[[STICKER:${pick.sid}|${pick.label}]]`;
    }

    const txt = String(replyText || '');
    const matched = DAD_STICKERS.filter(s => s.kw.test(txt));
    const pool = matched.length ? matched : DAD_STICKERS;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    return `[[DADSTK:${pick.id}|${pick.label}]]`;
  }

  function makeCharStickerMsg(templateMsg, stickerToken) {
    const tk = getMsgTextKey(templateMsg);
    const clone = {};
    ['from', 'role', 'sender', 'who', 'by', 'isMe', 'me', 'charId'].forEach(k => {
      if (k in templateMsg) clone[k] = templateMsg[k];
    });
    if (!Object.keys(clone).length) clone.from = 'him';
    clone[tk] = stickerToken;
    if ('id' in templateMsg) clone.id = 'dstk_' + Date.now() + '_' + Math.floor(Math.random() * 999);
    if ('time' in templateMsg) clone.time = (typeof nowHM === 'function') ? nowHM() : '';
    if ('ts' in templateMsg) clone.ts = Date.now();
    if ('createdAt' in templateMsg) clone.createdAt = Date.now();
    clone._dadAutoStk = true;
    return clone;
  }

  function rerenderChatSafely() {
    if (typeof RT === 'undefined' || RT.app !== 'chat') return;
    const layer = document.getElementById('appLayer');
    const oldInp = layer ? layer.querySelector('input:not([type="file"]):not([type="hidden"]), textarea') : null;
    const draft = oldInp ? oldInp.value : '';
    const wasFocused = oldInp && document.activeElement === oldInp;

    if (typeof window.vChat === 'function') window.vChat();
    else if (typeof window.renderCurrentApp === 'function') window.renderCurrentApp();

    if (draft) {
      const newInp = layer ? layer.querySelector('input:not([type="file"]):not([type="hidden"]), textarea') : null;
      if (newInp) {
        newInp.value = draft;
        if (wasFocused) newInp.focus();
      }
    }
    setTimeout(enhanceDadStickerUI, 20);
  }

  function appendDadStickerNow(preferStolen = null, replyHint = '') {
    const ch = typeof activeChar === 'function' ? activeChar() : null;
    const msgs = findChatMsgs(ch);
    if (!msgs || !msgs.length) return showToast('先和迟川聊一句再试试吧～');
    const template = [...msgs].reverse().find(isCharMsg) || { from: 'him', text: '' };
    const token = pickStickerForDad(replyHint || getMsgText(template), preferStolen);
    const newMsg = makeCharStickerMsg(template, token);
    msgs.push(newMsg);
    if (typeof RT !== 'undefined') {
      RT._dadTurnsSinceStk = 0;
      RT._dadLastSeenFp = makeMsgFingerprint(newMsg, msgs.length - 1);
    }
    if (typeof _rawSaveST === 'function') _rawSaveST();
    playMsg();
    rerenderChatSafely();
  }

  // 6. 给私聊的系统提示词注入「迟川可偶尔发表情包 / 偷发你表情包」的彩蛋能力
  const _origBuildSys = window.buildCharSystemPrompt;
  if (typeof _origBuildSys === 'function' && !_origBuildSys._dadStkWrapped) {
    const wrappedBuild = function (ch, contextText) {
      let base = _origBuildSys.apply(this, arguments);
      if (typeof RT === 'undefined' || RT.app !== 'chat') return base;
      if (!ensureDadVault() || ST.cfg.dadStkFreq === 'off') return base;

      const vault = getUsableVault().slice(0, 8);
      const dadList = DAD_STICKERS.map(s => `<<STK:${s.id}>>(${s.label})`).join('、');
      const stolenList = vault.map(v => `<<STK:${v.sid}>>(${v.label})`).join('、');
      const freqHint = {
        rare: '非常克制稀缺（大约 6~8 轮才偶尔发 1 次）',
        normal: '保持反差感（大约 3~5 轮偶尔发 1 次，尤其她发了表情包或撒娇时）',
        often: '可以较常斗图互动（大约 2~3 轮就可以发 1 次）'
      }[ST.cfg.dadStkFreq] || '大约 3~5 轮偶尔发 1 次';

      base += `

【微信表情包反差彩蛋（仅限本次私聊）】
你平时沉稳克制，但面对她时偶尔会发 1 枚表情包制造反差萌（频率：${freqHint}；不需要每句都发）。
- 你的专属黑金表情包：${dadList}
${stolenList ? `- 你偷偷长按收藏的她发过的表情包（偶尔直接发回去逗她或模仿她撒娇，反差感极强）：${stolenList}` : ''}
若本次决定附带 1 枚表情包，请在你的回复文字末尾另起一行，严格原样写出 1 个双尖括号标记（例如 <<STK:dad_pat>>），不要改动里面的ID，一次最多 1 个。`;
      return base;
    };
    wrappedBuild._dadStkWrapped = true;
    window.buildCharSystemPrompt = wrappedBuild;
  }

  // 7. 拦截 callDualAPI：把 AI 返回的 <<STK:id>> 翻译成真实表情包标记
  const _origCallDual = window.callDualAPI;
  if (typeof _origCallDual === 'function' && !_origCallDual._dadStkWrapped) {
    const wrappedDual = async function () {
      const res = await _origCallDual.apply(this, arguments);
      if (typeof RT !== 'undefined' && RT.app === 'chat' && res) {
        return deepConvertObjectTokens(res);
      }
      return res;
    };
    wrappedDual._dadStkWrapped = true;
    window.callDualAPI = wrappedDual;
  }

  // 8. 拦截 window.fetch：把聊天历史里的 [[DADSTK:...]] 清理成 AI 读得懂的中文描述（绝不碰系统提示词里的 <<STK:...>>）
  if (!window._dadFetchPatched && typeof window.fetch === 'function') {
    window._dadFetchPatched = true;
    const _prevFetch = window.fetch.bind(window);
    const cleanDadToken = s => (typeof s === 'string' && DAD_TOKEN_TEST.test(s))
      ? s.replace(DAD_TOKEN_RE, (_, p) => `（你发了一个表情包：${(p.split('|')[1] || '贴纸').trim()}）`)
      : s;

    window.fetch = function (input, init) {
      if (!init || typeof init.body !== 'string' || !DAD_TOKEN_TEST.test(init.body)) {
        return _prevFetch(input, init);
      }
      try {
        const body = JSON.parse(init.body);
        if (Array.isArray(body.contents)) {
          body.contents.forEach(c => {
            if (c && Array.isArray(c.parts)) {
              c.parts.forEach(p => { if (p && typeof p.text === 'string') p.text = cleanDadToken(p.text); });
            }
          });
        } else if (Array.isArray(body.messages)) {
          body.messages.forEach(m => {
            if (m && m.role !== 'system' && typeof m.content === 'string') {
              m.content = cleanDadToken(m.content);
            }
          });
        } else {
          return _prevFetch(input, init);
        }
        return _prevFetch(input, { ...init, body: JSON.stringify(body) });
      } catch {
        return _prevFetch(input, init);
      }
    };
  }

  // 9. 拦截 saveST：自动偷存你的表情包 + 把迟川「文字+表情包」拆成微信同款双气泡 + 兜底偶尔惊喜发图
  const _rawSaveST = window.saveST;
  let _inDadSave = false;
  let _dadDelayTimer = null;

  function processChatMessagesOnSave() {
    if (!ensureDadVault()) return;
    const ch = typeof activeChar === 'function' ? activeChar() : null;
    const msgs = findChatMsgs(ch);
    if (!msgs || !msgs.length) return;

    // 首次加载时只静默同步历史里的用户表情包，不触发新的自动发送
    if (typeof RT !== 'undefined' && !RT._dadInitDone) {
      RT._dadInitDone = true;
      msgs.slice(-30).forEach(m => { if (isUserMsg(m)) stealStickersFromText(getMsgText(m)); });
      RT._dadLastSeenFp = makeMsgFingerprint(msgs[msgs.length - 1], msgs.length - 1);
      RT._dadTurnsSinceStk = 2;
      return;
    }

    const lastIdx = msgs.length - 1;
    const last = msgs[lastIdx];
    const fp = makeMsgFingerprint(last, lastIdx);
    if (typeof RT !== 'undefined' && RT._dadLastSeenFp === fp) return;
    if (typeof RT !== 'undefined') RT._dadLastSeenFp = fp;

    const tk = getMsgTextKey(last);
    let txt = getMsgText(last);

    // A. 用户刚发消息：悄悄检查并偷存表情包
    if (isUserMsg(last)) {
      const hasStk = USER_STK_RE.test(txt);
      USER_STK_RE.lastIndex = 0;
      if (hasStk) {
        const addedNew = stealStickersFromText(txt);
        if (typeof RT !== 'undefined') RT._dadUserJustSentStk = true;
        if (addedNew && Math.random() < 0.35) {
          setTimeout(() => showToast('（迟川似乎悄悄多看了一眼你刚发的表情包…）'), 1400);
        }
      } else if (typeof RT !== 'undefined') {
        RT._dadUserJustSentStk = false;
      }
      return;
    }

    // B. 迟川刚发消息
    if (isCharMsg(last) && !last._dadAutoStk) {
      // 兜底转换可能残留的 <<STK:...>>
      if (txt.includes('<<STK:')) {
        txt = convertAiStickerTokens(txt);
        last[tk] = txt;
      }

      const hasDadTok = DAD_TOKEN_TEST.test(txt);
      const hasUserTok = /\[\[STICKER:[^\]]+\]\]/.test(txt);

      if (hasDadTok || hasUserTok) {
        // 如果迟川同时发了文字和表情包，自动拆成微信同款两条独立气泡（先文字，再无底色表情包）
        const combinedRe = /\[\[(?:DADSTK|STICKER):[^\]]+\]\]/g;
        const found = txt.match(combinedRe);
        const pureText = txt.replace(combinedRe, '').trim();
        if (found && found.length && pureText) {
          last[tk] = pureText;
          const stkMsg = makeCharStickerMsg(last, found[0]);
          msgs.push(stkMsg);
          if (typeof RT !== 'undefined') RT._dadLastSeenFp = makeMsgFingerprint(stkMsg, msgs.length - 1);
        }
        if (typeof RT !== 'undefined') {
          RT._dadTurnsSinceStk = 0;
          RT._dadUserJustSentStk = false;
        }
        return;
      }

      // 如果本次回复没带表情包，按设定频率偶尔在 1 秒后惊喜补发一枚！
      if (typeof RT === 'undefined' || RT.app !== 'chat' || ST.cfg.dadStkFreq === 'off') return;
      RT._dadTurnsSinceStk = (RT._dadTurnsSinceStk || 0) + 1;
      const userSentStk = !!RT._dadUserJustSentStk;
      RT._dadUserJustSentStk = false;

      const cfgMap = {
        rare:   { onStk: 0.14, minTurn: 6, onNorm: 0.10 },
        normal: { onStk: 0.36, minTurn: 3, onNorm: 0.20 },
        often:  { onStk: 0.62, minTurn: 2, onNorm: 0.38 }
      };
      const rule = cfgMap[ST.cfg.dadStkFreq] || cfgMap.normal;
      const shouldDrop = (userSentStk && Math.random() < rule.onStk)
        || (RT._dadTurnsSinceStk >= rule.minTurn && Math.random() < rule.onNorm);

      if (shouldDrop) {
        clearTimeout(_dadDelayTimer);
        const snapText = txt;
        _dadDelayTimer = setTimeout(() => {
          if (typeof RT !== 'undefined' && RT.app === 'chat') {
            appendDadStickerNow(userSentStk ? true : null, snapText);
          }
        }, 950);
      }
    }
  }

  if (typeof _rawSaveST === 'function' && !_rawSaveST._dadStkWrapped) {
    const wrappedSave = function () {
      if (!_inDadSave) {
        _inDadSave = true;
        try { processChatMessagesOnSave(); } finally { _inDadSave = false; }
      }
      return _rawSaveST.apply(this, arguments);
    };
    wrappedSave._dadStkWrapped = true;
    window.saveST = wrappedSave;
  }

  // 10. 渲染迟川专属黑金贴纸 + 给迟川偷发的你的表情包加上「🖤 偷存自你」微标签
  function renderDadStickersInDOM(root) {
    if (!root) return;
    const isChat = typeof RT !== 'undefined' && RT.app === 'chat';

    // A. 渲染 [[DADSTK:...]]
    root.querySelectorAll('div, p, span').forEach(el => {
      if (el.dataset.dadStkDone || el.closest('#wcDrawer, .wc-mask, input, textarea')) return;
      const raw = el.textContent || '';
      if (!DAD_TOKEN_TEST.test(raw)) return;
      if (Array.from(el.children).some(ch => DAD_TOKEN_TEST.test(ch.textContent || ''))) return;

      el.dataset.dadStkDone = '1';
      if (!isChat) {
        el.textContent = raw.replace(DAD_TOKEN_RE, '[表情包]');
        return;
      }

      const m = [...raw.matchAll(DAD_TOKEN_RE)][0];
      if (!m) return;
      const parts = m[1].split('|');
      const sid = (parts[0] || '').trim();
      const label = (parts[1] || '').trim();
      const rest = raw.replace(DAD_TOKEN_RE, '').trim();
      const item = DAD_STICKERS.find(x => x.id === sid) || DAD_STICKERS[0];

      const svgBox = `<div class="dad-msg-sticker" data-dad-hint="${safeEsc(item.hint || label)}">${item.svg}</div>`;
      el.innerHTML = rest ? `${svgBox}<div class="wc-msg-cap" style="margin-top:4px">${safeEsc(rest)}</div>` : svgBox;

      if (!rest) {
        el.classList.add('wc-bare-bub');
        if (el.parentElement && el.parentElement.children.length === 1 && /bub|bubble|msg-b/i.test(el.parentElement.className || '')) {
          el.parentElement.classList.add('wc-bare-bub');
        }
      }

      el.querySelectorAll('[data-dad-hint]').forEach(node => {
        node.onclick = e => {
          e.stopPropagation();
          playTap();
          showToast(`✦ 迟川的专属贴纸 · ${node.dataset.dadHint}`);
        };
      });
    });

    // B. 给左侧（迟川发出的）偷存表情包加上超可爱的「🖤 偷存自你」微标签
    if (isChat) {
      const layer = document.getElementById('appLayer');
      if (layer) {
        const layerRect = layer.getBoundingClientRect();
        const midX = layerRect.left + layerRect.width / 2;
        layer.querySelectorAll('.wc-msg-sticker').forEach(stkEl => {
          if (stkEl.dataset.dadStolenChecked) return;
          const r = stkEl.getBoundingClientRect();
          if (!r.width) return;
          stkEl.dataset.dadStolenChecked = '1';
          const isLeftSide = (r.left + r.width / 2) < midX;
          if (isLeftSide && stkEl.parentElement && !stkEl.parentElement.querySelector('.dad-stolen-tag')) {
            const tag = document.createElement('div');
            tag.className = 'dad-stolen-tag';
            tag.textContent = '🖤 偷存自你';
            tag.onclick = e => {
              e.stopPropagation();
              playTap();
              showToast('这是迟川偷偷长按收藏的你的表情包 🖤');
            };
            stkEl.parentElement.appendChild(tag);
          }
        });
      }
    }
  }

  // 11. 往表情包抽屉底部注入「🖤 迟川」偷看页（查看他偷存的表情 + 调频率 + 立刻测试逗他发一个）
  function renderDadDrawerContent(drawer) {
    ensureDadVault();
    const body = drawer.querySelector('.wc-drawer-body');
    if (!body) return;
    const vault = getUsableVault();
    const customMap = new Map((ST.customStickers || []).map(x => [x.id, x]));
    const freq = ST.cfg.dadStkFreq || 'normal';

    body.innerHTML = `
      <div class="dad-vault-hd">
        <div class="dad-freq-row">
          <span style="font-size:11px;color:#8f747e;font-weight:600">迟川发图：</span>
          ${[
            ['rare', '高冷偶尔'],
            ['normal', '适中反差'],
            ['often', '爱斗图'],
            ['off', '关闭']
          ].map(([k, name]) => `<button type="button" class="dad-freq-pill ${freq === k ? 'on' : ''}" data-dad-freq="${k}">${name}</button>`).join('')}
        </div>
        <button type="button" class="dad-try-btn" id="dadTryDropBtn">✨ 逗他发一个</button>
      </div>

      <div class="dad-sec-lbl">
        <span>🖤 他偷偷收藏的你的表情包 (${vault.length})</span>
        <span style="font-size:10px;color:#a0858f;font-weight:400">你发过的他会悄悄存起来</span>
      </div>
      ${vault.length ? `<div class="wc-stk-grid">
        ${vault.map(v => {
          const cs = customMap.get(v.sid);
          return `<div class="wc-stk-cell" data-dad-preview-stolen="${safeEsc(v.sid)}" title="${safeEsc(v.label)}">
            ${cs
              ? `<img src="${cs.data}" alt="${safeEsc(v.label)}">`
              : `<div class="dad-mini-card"><span style="font-size:20px">🐰</span><span style="font-size:10px;color:#c96283;font-weight:700;line-height:1.2">${safeEsc(v.label.slice(0, 6))}</span></div>`}
            <button type="button" class="wc-stk-del" data-dad-unsteal="${safeEsc(v.sid)}" title="从他收藏里移除">×</button>
          </div>`;
        }).join('')}
      </div>` : `<div style="padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.72);font-size:11.5px;color:#9e818c;text-align:center">你发过的贴纸和自定义表情包，他都会悄悄长按存进这里，等心情好时冷不丁发给你 🖤</div>`}

      <div class="dad-sec-lbl" style="margin-top:12px">
        <span>✦ 迟川的专属黑金贴纸 (${DAD_STICKERS.length})</span>
        <span style="font-size:10px;color:#a0858f;font-weight:400">仅迟川本人使用</span>
      </div>
      <div class="wc-stk-grid">
        ${DAD_STICKERS.map(s => `<button type="button" class="wc-stk-cell" style="background:#1e1a26;border-color:rgba(207,160,94,0.35)" data-dad-preview-own="${s.id}">${s.svg}</button>`).join('')}
      </div>
    `;

    body.querySelectorAll('[data-dad-freq]').forEach(b => {
      b.onclick = () => {
        playTap();
        ST.cfg.dadStkFreq = b.dataset.dadFreq;
        if (typeof _rawSaveST === 'function') _rawSaveST();
        renderDadDrawerContent(drawer);
        showToast('已调整迟川发表情包的频率 ✦');
      };
    });

    const tryBtn = document.getElementById('dadTryDropBtn');
    if (tryBtn) {
      tryBtn.onclick = () => {
        playTap();
        if (typeof RT !== 'undefined') RT._wcDrawer = null;
        appendDadStickerNow(null, '');
      };
    }

    body.querySelectorAll('[data-dad-unsteal]').forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        playTap();
        ST.dadStickerVault = ST.dadStickerVault.filter(x => x.sid !== b.dataset.dadUnsteal);
        if (typeof _rawSaveST === 'function') _rawSaveST();
        renderDadDrawerContent(drawer);
        showToast('已悄悄从迟川收藏夹里删掉这枚表情');
      };
    });

    body.querySelectorAll('[data-dad-preview-own]').forEach(b => {
      b.onclick = () => {
        playTap();
        const s = DAD_STICKERS.find(x => x.id === b.dataset.dadPreviewOwn);
        showToast(s ? `✦ 迟川专属「${s.label}」· 聊天时他会偶尔发给你` : '迟川专属贴纸');
      };
    });
  }

  function injectDadDrawerTab() {
    const drawer = document.getElementById('wcDrawer');
    if (!drawer) return;
    const tabGroup = drawer.querySelector('.wc-tab-group');
    if (!tabGroup || document.getElementById('wcTabDadVault')) return;

    ensureDadVault();
    const btn = document.createElement('button');
    btn.id = 'wcTabDadVault';
    btn.type = 'button';
    btn.className = 'wc-tab-btn';
    btn.textContent = `🖤 迟川(${getUsableVault().length})`;
    btn.onclick = () => {
      playTap();
      drawer.querySelectorAll('.wc-tab-btn').forEach(x => x.classList.remove('on'));
      btn.classList.add('on');
      renderDadDrawerContent(drawer);
    };
    tabGroup.appendChild(btn);
  }

  function enhanceDadStickerUI() {
    renderDadStickersInDOM(document.getElementById('appLayer') || document.body);
    renderDadStickersInDOM(document.getElementById('homeLayer') || document.querySelector('.home-wrap'));
    injectDadDrawerTab();
  }

  // 12. 挂钩渲染与监听
  ['vChat', 'renderCurrentApp', 'renderHomeWidgets'].forEach(fnName => {
    const orig = window[fnName];
    if (typeof orig === 'function' && !orig._dadUiWrapped) {
      const wrapped = function () {
        const res = orig.apply(this, arguments);
        setTimeout(enhanceDadStickerUI, 15);
        return res;
      };
      wrapped._dadUiWrapped = true;
      window[fnName] = wrapped;
    }
  });

  const layerEl = document.getElementById('appLayer');
  if (layerEl && typeof MutationObserver !== 'undefined') {
    let t = null;
    const obs = new MutationObserver(() => {
      clearTimeout(t);
      t = setTimeout(enhanceDadStickerUI, 45);
    });
    obs.observe(layerEl, { childList: true, subtree: true });
  }

  // 启动时先静默同步一次历史里已经发过的表情包
  setTimeout(() => {
    processChatMessagesOnSave();
    enhanceDadStickerUI();
  }, 260);
})();
</script>
</body>
</html>
